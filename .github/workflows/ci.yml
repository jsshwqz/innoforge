name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Format (independent: fmt failure must not skip any other job) ──
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  # ── Clippy (independent) ──
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Tests (independent: includes all cargo tests) ──
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  # ── Privacy guards (independent: must run even if fmt/clippy fail) ──
  privacy-guards:
    name: Privacy Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run no_case_data_in_repo guard
        run: cargo test --test no_case_data_in_repo

  # ── Template guards (independent: must run even if fmt/clippy fail) ──
  template-guards:
    name: Template Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inline script parse guard
        run: cargo test --test inline_scripts_parse
      - name: No native dialog guard
        run: cargo test --test no_native_dialog
      - name: No English dialog literals guard
        run: cargo test --test no_english_dialog_literals
      - name: No CDN scripts guard
        run: cargo test --test no_cdn_scripts

  # ── Lint (independent) ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: HTML 模板函数完整性（含基线回归）
        run: node check_html_functions.mjs
      - name: ESLint JS
        run: npx eslint static/i18n.js

  # ── E2E (independent: must run even if fmt/clippy/test fail) ──
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install node deps
        run: npm ci
      - name: Install Chromium
        run: npx puppeteer browsers install chrome
      - name: Build server (debug)
        run: cargo build
      - name: Start server
        run: |
          ./target/debug/innoforge-server >/tmp/innoforge.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -sI http://127.0.0.1:3000/
      - name: Run E2E
        run: node e2e_test.mjs
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid 2>/dev/null) 2>/dev/null || true
      - name: Server log (failure)
        if: failure()
        run: tail -n 60 /tmp/innoforge.log 2>/dev/null || true

  # ── Doc staleness (independent: issue #31 — 复盘规则空转防护) ──
  # If PR changes src/templates/tests/.github but NOT docs/errors.md or
  # docs/plans/STATUS.md, fail. Exempt if PR body contains "本轮无新增踩坑".
  doc-staleness:
    name: Doc Staleness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check doc staleness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail

          # Get all changed files in this PR
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Check if code/config files changed
          CODE_CHANGED=0
          for f in $CHANGED; do
            case "$f" in
              src/*|templates/*|tests/*|.github/*) CODE_CHANGED=1 ;;
            esac
          done

          # Check if retrospective docs changed
          DOCS_CHANGED=0
          for f in $CHANGED; do
            case "$f" in
              docs/errors.md|docs/plans/STATUS.md) DOCS_CHANGED=1 ;;
            esac
          done

          echo "Code/config changed: $CODE_CHANGED"
          echo "Retrospective docs changed: $DOCS_CHANGED"

          # If no code changed, nothing to check
          if [ "$CODE_CHANGED" -eq 0 ]; then
            echo "✅ No code/config changes — doc staleness check skipped"
            exit 0
          fi

          # If docs changed, check passes
          if [ "$DOCS_CHANGED" -eq 1 ]; then
            echo "✅ Retrospective docs updated — check passes"
            exit 0
          fi

          # Code changed but docs didn't — check for exemption in PR body
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')

          if echo "$PR_BODY" | grep -qF "本轮无新增踩坑"; then
            echo "✅ Exempted by PR description: '本轮无新增踩坑'"
            exit 0
          fi

          # Fail
          echo "❌ Code/config changed but docs/errors.md and docs/plans/STATUS.md not updated"
          echo "   If this PR genuinely introduces no new pitfalls, add '本轮无新增踩坑' to the PR description."
          echo "   Changed files:"
          echo "$CHANGED" | sed 's/^/     /'
          exit 1


  # ── Autoclose hygiene (issue #43 — 防止 CHANGELOG 裸 #NN 被复制进 commit 触发自动关闭) ──
  # CHANGELOG.md 新增行里出现裸 #NN 会导致 GitHub 在合并时自动关闭该 issue。
  # 事故：8437c42 的 message 含 "fix #13" 把未通过验收的 #13 关掉了。
  autoclose-hygiene:
    name: Autoclose Hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG for bare issue references
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Check CHANGELOG.md diff for new lines containing bare #NN
          VIOLATIONS=""
          VIOLATION_COUNT=0

          while IFS= read -r line; do
            # Only process added lines (starting with +, not +++ which is the file header)
            case "$line" in
              +++*) continue ;;
              +*) ;;
              *) continue ;;
            esac

            # Extract the content after the +
            content="${line#+}"

            # Skip empty lines
            [ -z "$content" ] && continue

            # Check for bare #NN (but not markdown links like [text](...#NN) or [issue NN](...))
            # We flag any line containing #\d+ that isn't inside a markdown link
            if echo "$content" | grep -qP '#\d+'; then
              # Check if it's inside a markdown link — skip if #NN is:
              # 1) inside URL part of link: ](...#NN)
              # 2) inside a full URL: https://...#NN
              # 3) inside link text as [#NN](...) — markdown link with # in the label
              if echo "$content" | grep -qP '\]\([^)]*#\d+\)' || echo "$content" | grep -qP 'https?://[^ ]*#\d+' || echo "$content" | grep -qP '\[#\d+\]\(''; then
                # It's inside a markdown link or URL — allowed
                continue
              fi
              VIOLATION_COUNT=$((VIOLATION_COUNT + 1))
              VIOLATIONS="${VIOLATIONS}\n  CHANGELOG.md: bare #NN found: ${content}"
            fi
          done < <(git diff "$BASE" "$HEAD" -- CHANGELOG.md)

          if [ "$VIOLATION_COUNT" -gt 0 ]; then
            echo "❌ CHANGELOG.md contains bare #NN references on new lines."
            echo "   These can be copied into commit messages and trigger GitHub auto-close."
            echo ""
            echo "   Violations:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "   Fix: replace #NN with [issue NN](../issues/NN) or write the issue title instead."
            exit 1
          fi

          echo "✅ No bare #NN references in CHANGELOG.md new lines."
