name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: HTML 模板函数完整性（含基线回归）
        run: node check_html_functions.mjs
      - name: ESLint JS
        run: npx eslint static/i18n.js

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install node deps
        run: npm ci
      - name: Install Chromium
        run: npx puppeteer browsers install chrome
      - name: Build server (debug)
        run: cargo build
      - name: Start server
        run: |
          ./target/debug/innoforge-server >/tmp/innoforge.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -sI http://127.0.0.1:3000/
      - name: Run E2E
        run: node e2e_test.mjs
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid 2>/dev/null) 2>/dev/null || true
      - name: Server log (failure)
        if: failure()
        run: tail -n 60 /tmp/innoforge.log 2>/dev/null || true