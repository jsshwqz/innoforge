name: Guard Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to scan (branch, tag, or SHA)'
        required: false
        default: 'main'
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  guard:
    name: Case-data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
      - name: Overlay main guard
        run: |
          git fetch origin main
          git show FETCH_HEAD:tests/no_case_data_in_repo.rs > tests/no_case_data_in_repo.rs
          # Ensure sha2 dev-dependency exists (main guard uses it)
          if ! grep -q 'sha2' Cargo.toml; then
            if grep -q '\[dev-dependencies\]' Cargo.toml; then
              sed -i '/\[dev-dependencies\]/a sha2 = "0.10"' Cargo.toml
            else
              printf '\n[dev-dependencies]\nsha2 = "0.10"\n' >> Cargo.toml
            fi
          fi
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run case-data guard
        run: cargo test --test no_case_data_in_repo
