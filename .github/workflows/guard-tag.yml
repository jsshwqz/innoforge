name: Guard Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to scan (branch, tag, or SHA)'
        required: false
        default: 'main'
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  guard:
    name: Case-data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run case-data guard
        run: cargo test --test no_case_data_in_repo
