<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创研台 InnoForge</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <script src="/static/purify.min.js"></script>
</head>
<body>
    <div class="page-with-sidebar">
    <aside id="page-sidebar" class="page-sidebar"></aside>
    <main class="page-main">
        <div class="hero">
            <h1>创研台</h1>
            <p class="subtitle">从想法到落地 · 决策依据 · 执行方案 · 知识产权保护</p>
        </div>

        <!-- 研发流程指引 -->
        <div class="workflow-hint">
            <span class="step">描述想法</span>
            <span class="arrow">&rarr;</span>
            <span class="step">AI 分析推演</span>
            <span class="arrow">&rarr;</span>
            <span class="step">全网技术调研</span>
            <span class="arrow">&rarr;</span>
            <span class="step">可行性报告</span>
        </div>

        <!-- 主入口：描述你的想法 -->
        <div class="main-entry">
            <div class="idea-input-area">
                <label>描述你的技术想法或创新方案</label>
                <textarea id="idea-input" placeholder="例如：一种基于液态金属的手机散热方案，利用镓铟合金的高导热性，在手机内部形成微循环散热通道...

支持粘贴文字，也可以拖入文件。越详细，AI 验证越准确。"></textarea>

                <!-- 文件上传区 -->
                <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" multiple accept=".pdf,.docx,.doc,.txt,.png,.jpg,.jpeg,.gif,.bmp,.webp">
                    拖拽文件到此处，或点击上传（PDF / Word / 图片 / 文本）
                </div>
                <div class="file-list" id="file-list"></div>

                <!-- 模式选择 -->
                <div class="mode-toggle">
                    <button class="mode-btn active" onclick="setMode('chat')" id="mode-chat">
                        <span class="mode-icon">💬</span>
                        <span class="mode-name">AI 对话梳理</span>
                        <span class="mode-desc">先与 AI 讨论，梳理技术方案后再验证</span>
                    </button>
                    <button class="mode-btn" onclick="setMode('quick')" id="mode-quick">
                        <span class="mode-icon">⚡</span>
                        <span class="mode-name">快速推演</span>
                        <span class="mode-desc">6 步快速验证可行性，约 30 秒</span>
                    </button>
                    <button class="mode-btn" onclick="setMode('deep')" id="mode-deep">
                        <span class="mode-icon">🧠</span>
                        <span class="mode-name">深度推演</span>
                        <span class="mode-desc">13 步全链路调研，约 2-5 分钟</span>
                    </button>
                </div>
                <div class="mode-hint" id="mode-hint">先与 AI 对话，梳理技术方案、拆解创新点，确认后再验证</div>

                <div class="start-buttons">
                    <button class="btn-primary" onclick="startFlow()" id="start-btn">开始对话</button>
                    <button class="btn-secondary" onclick="window.location.href='/idea'">历史项目</button>
                </div>
            </div>
        </div>

        <!-- 服务状态 -->
        <div class="service-status-bar" id="service-status">
            <a href="/settings?from=/" id="status-ai" class="status-badge"></a>
            <a href="/settings?from=/" id="status-search" class="status-badge"></a>
        </div>

        <!-- 最近项目 -->
        <div class="recent-section" id="recent-ideas">
            <h3>最近项目</h3>
            <div class="recent-list" id="recent-list"></div>
        </div>

        <!-- 快速抓取（折叠，不抢焦点） -->
        <div class="quick-fetch">
            <details>
                <summary>快速导入技术文献（输入专利号或文献编号）</summary>
                <div class="fetch-box">
                    <input type="text" id="fetch-number" placeholder="输入专利号 (如 EP1234567, US10000000)">
                    <select id="fetch-source">
                        <option value="epo">EPO (欧洲/全球)</option>
                        <option value="uspto">USPTO (美国)</option>
                    </select>
                    <button onclick="fetchPatent()">抓取</button>
                </div>
                <div class="fetch-result" id="fetch-result"></div>
            </details>
        </div>

        <footer class="page-footer">
            v{{version}} · <a href="https://github.com/jsshwqz/innoforge" target="_blank" rel="noopener">GitHub</a> · <a href="https://gitee.com/jsshwqz/innoforge" target="_blank" rel="noopener">Gitee</a> · MIT License
        </footer>
    </main>
    </div>

    <!-- PDF Preview Modal -->
    <div class="pdf-modal-overlay" id="pdf-preview-modal">
        <div class="pdf-modal">
            <button class="pdf-modal-close" onclick="closePdfPreview()">&times;</button>
            <iframe id="pdf-preview-iframe" src="about:blank"></iframe>
        </div>
    </div>

    <script src="/static/i18n.js"></script>
    <script>
    renderNavbar('home');
    renderSidebar(
      '<div class="sidebar-section">'
      + '<div class="sidebar-label">推演模式</div>'
      + '<button class="sidebar-btn primary" id="sb-mode-chat" onclick="setMode(\'chat\')">对话梳理</button>'
      + '<button class="sidebar-btn" id="sb-mode-quick" onclick="setMode(\'quick\')">快速推演</button>'
      + '<button class="sidebar-btn" id="sb-mode-deep" onclick="setMode(\'deep\')">深度推演</button>'
      + '</div>'
    );
    applyI18nCommon();
    </script>
    <script>
    let currentMode = 'chat';
    let uploadedFiles = [];
    const UPLOAD_STORAGE_KEY = 'innoforge_uploaded_files';
    let restoredFiles = [];

    function saveUploadedMeta() {
        try {
            const data = restoredFiles.map(f => ({ name: f.name, size: f.size, type: f.type, text: f.text, timestamp: f.timestamp }));
            localStorage.setItem(UPLOAD_STORAGE_KEY, JSON.stringify(data));
        } catch(e) { /* ignore quota errors */ }
    }

    function loadUploadedMeta() {
        try {
            const raw = localStorage.getItem(UPLOAD_STORAGE_KEY);
            if (raw) { restoredFiles = JSON.parse(raw); } else { restoredFiles = []; }
        } catch(e) { restoredFiles = []; }
    }

    function removeRestoredFile(idx) {
        restoredFiles.splice(idx, 1);
        saveUploadedMeta();
        renderFileList();
    }

    // ── PDF Preview ──
    function showPdfPreview(url) {
        var iframe = document.getElementById('pdf-preview-iframe');
        iframe.src = url;
        document.getElementById('pdf-preview-modal').classList.add('show');
    }

    function closePdfPreview() {
        document.getElementById('pdf-preview-modal').classList.remove('show');
        document.getElementById('pdf-preview-iframe').src = 'about:blank';
    }

    document.getElementById('pdf-preview-modal').addEventListener('click', function(e) {
        if (e.target === this) closePdfPreview();
    });

    async function previewPdfFile(idx) {
        var file = uploadedFiles[idx];
        if (!file) return;
        var form = new FormData();
        form.append('file', file);
        try {
            var resp = await fetch('/api/upload/pdf-store', { method: 'POST', body: form });
            if (!resp.ok) throw new Error('上传失败 (' + resp.status + ')');
            var data = await resp.json();
            if (data.status === 'ok' && data.url) {
                showPdfPreview(data.url);
            } else {
                alert(data.message || 'PDF 存储失败');
            }
        } catch(e) {
            alert('PDF 预览失败: ' + e.message);
        }
    }

    // 模式切换
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('mode-' + mode).classList.add('active');
        // Sync sidebar buttons
        ['chat','quick','deep'].forEach(function(m) {
            var sb = document.getElementById('sb-mode-' + m);
            if (sb) { sb.className = 'sidebar-btn' + (m === mode ? ' primary' : ''); }
        });
        const hints = {
            chat: '先与 AI 对话，梳理技术方案、拆解创新点，确认后再推演',
            quick: '跳过对话，直接运行 6 步快速推演（约 30 秒）',
            deep: '跳过对话，直接运行 13 步深度推演（约 2-5 分钟）'
        };
        const btnTexts = { chat: '开始对话', quick: '快速推演', deep: '深度推演' };
        document.getElementById('mode-hint').textContent = hints[mode];
        document.getElementById('start-btn').textContent = btnTexts[mode];
    }

    // 文件上传
    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');

    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => addFiles(fileInput.files));

    // 粘贴图片支持
    document.getElementById('idea-input').addEventListener('paste', e => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        let hasImage = false;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                hasImage = true;
                const blob = items[i].getAsFile();
                const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const ext = blob.type.split('/')[1] || 'png';
                const file = new File([blob], 'paste-' + ts + '.' + ext, { type: blob.type });
                if (uploadedFiles.length < 5) {
                    uploadedFiles.push(file);
                } else {
                    alert('最多上传 5 个文件');
                }
            }
        }
        if (hasImage) {
            e.preventDefault();
            renderFileList();
        }
    });

    function addFiles(fileList) {
        for (const f of fileList) {
            if (f.size > 10 * 1024 * 1024) { alert(f.name + ' 超过 10MB 限制'); continue; }
            if (uploadedFiles.length >= 5) { alert('最多上传 5 个文件'); break; }
            uploadedFiles.push(f);
        }
        renderFileList();
    }

    function removeFile(idx) {
        uploadedFiles.splice(idx, 1);
        renderFileList();
    }

    function renderFileList() {
        const el = document.getElementById('file-list');
        if (uploadedFiles.length === 0 && restoredFiles.length === 0) { el.innerHTML = ''; return; }
        el.innerHTML = '';
        uploadedFiles.forEach((f, i) => {
            const size = f.size < 1024 ? f.size + 'B' : (f.size / 1024).toFixed(1) + 'KB';
            const icon = f.type.startsWith('image/') ? '🖼' : f.name.endsWith('.pdf') ? '📄' : '📎';
            const item = document.createElement('div');
            item.className = 'file-item';
            const span = document.createElement('span');
            span.textContent = icon + ' ' + f.name + ' (' + size + ')';
            const actions = document.createElement('span');
            actions.style.cssText = 'display:flex;align-items:center;gap:2px;';
            if (f.name.toLowerCase().endsWith('.pdf')) {
                const pvBtn = document.createElement('button');
                pvBtn.className = 'preview-btn';
                pvBtn.textContent = '👁';
                pvBtn.title = '查看原文';
                pvBtn.setAttribute('onclick', 'previewPdfFile(' + i + ')');
                actions.appendChild(pvBtn);
            }
            const btn = document.createElement('button');
            btn.className = 'remove';
            btn.textContent = 'x';
            btn.setAttribute('onclick', 'removeFile(' + i + ')');
            actions.appendChild(btn);
            item.appendChild(span);
            item.appendChild(actions);
            el.appendChild(item);
        });
        // Restored files from localStorage
        restoredFiles.forEach(function(f, i) {
            const size = f.size < 1024 ? f.size + 'B' : (f.size / 1024).toFixed(1) + 'KB';
            const item = document.createElement('div');
            item.className = 'file-item';
            const span = document.createElement('span');
            span.textContent = '📄 ' + f.name + ' (' + size + ')';
            const tag = document.createElement('span');
            tag.textContent = '已保存';
            tag.style.cssText = 'color:#3fb950;font-size:0.75em;margin-left:6px;';
            span.appendChild(tag);
            const actions = document.createElement('span');
            actions.style.cssText = 'display:flex;align-items:center;gap:2px;';
            const btn = document.createElement('button');
            btn.className = 'remove';
            btn.textContent = 'x';
            btn.setAttribute('onclick', 'removeRestoredFile(' + i + ')');
            actions.appendChild(btn);
            item.appendChild(span);
            item.appendChild(actions);
            el.appendChild(item);
        });
    }

    // 主流程
    async function startFlow() {
        const text = document.getElementById('idea-input').value.trim();
        if (!text && uploadedFiles.length === 0 && restoredFiles.length === 0) {
            document.getElementById('idea-input').focus();
            return;
        }

        const title = (text.split(/[。.!！?\n]/)[0] || '').substring(0, 50) || '新研发项目';
        let description = text;

        // 处理上传的文件（上传提取内容）
        if (uploadedFiles.length > 0) {
            document.getElementById('start-btn').textContent = '上传文件中...';
            document.getElementById('start-btn').disabled = true;
            for (const f of uploadedFiles) {
                try {
                    const formData = new FormData();
                    formData.append('file', f);
                    const resp = await fetch('/api/upload/extract', {
                        method: 'POST', body: formData
                    });
                    if (!resp.ok) throw new Error('上传失败 (' + resp.status + ')');
                    const data = await resp.json();
                    if (data.text) {
                        // Use full text — no truncation. PDFs often have 20k+ chars.
                        description += '\n\n---附件: ' + f.name + '---\n' + data.text;
                        // Save to localStorage for persistence across refresh
                        const already = restoredFiles.some(function(rf) { return rf.name === f.name && rf.size === f.size; });
                        if (!already) {
                            restoredFiles.push({ name: f.name, size: f.size, type: f.type || 'application/pdf', text: data.text, timestamp: Date.now() });
                            saveUploadedMeta();
                        }
                    }
                } catch(e) {
                    console.error('文件提取失败:', f.name, e);
                }
            }
            document.getElementById('start-btn').disabled = false;
        }

        // 处理从 localStorage 恢复的文件（直接使用已保存的文本，无需重新上传）
        restoredFiles.forEach(function(f) {
            if (f.text) {
                // Use full text — no truncation
                description += '\n\n---附件: ' + f.name + '---\n' + f.text;
            }
        });

        // 提交创意
        try {
            const hasFiles = uploadedFiles.length > 0 || restoredFiles.length > 0;
            const resp = await fetch('/api/idea/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, description, input_type: hasFiles ? 'mixed' : 'text' })
            });
            if (!resp.ok) { alert('服务器错误 (' + resp.status + ')'); return; }
            const data = await resp.json();
            if (!data.id) { alert(data.message || '提交失败'); return; }

            // 根据模式跳转
            if (currentMode === 'chat') {
                window.location.href = '/idea?id=' + data.id + '&mode=chat';
            } else if (currentMode === 'quick') {
                window.location.href = '/idea?id=' + data.id + '&autostart=quick';
            } else {
                window.location.href = '/idea?id=' + data.id + '&autostart=deep';
            }
        } catch(e) {
            alert('请求失败: ' + e);
        }
    }

    // Ctrl+Enter 提交
    document.getElementById('idea-input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.ctrlKey) startFlow();
    });

    // 页面加载时恢复已保存的文件
    loadUploadedMeta();
    renderFileList();

    // 服务状态检测
    (async function checkStatus() {
        try {
            var resp = await fetch('/api/settings');
            var data = await resp.json();
            var aiEl = document.getElementById('status-ai');
            var searchEl = document.getElementById('status-search');
            if (data.ai_api_key_configured) {
                aiEl.textContent = '✅ AI 服务已配置';
                aiEl.style.color = '#3fb950';
            } else {
                aiEl.textContent = '⚠️ AI 未配置 — 点击设置';
                aiEl.style.color = '#d29922';
                aiEl.style.borderColor = '#d29922';
            }
            if (data.serpapi_key_configured || data.bing_api_key_configured || data.lens_api_key_configured) {
                searchEl.textContent = '✅ 在线搜索已配置';
                searchEl.style.color = '#3fb950';
            } else {
                searchEl.textContent = 'ℹ️ 在线搜索未配置（可用本地库）';
                searchEl.style.color = '#8b949e';
            }
        } catch(e) {}
    })();

    // 加载最近项目
    (async function loadRecentIdeas() {
        try {
            var resp = await fetch('/api/idea/list');
            if (!resp.ok) return;
            var data = await resp.json();
            var ideas = (data.ideas || data || []).slice(0, 5);
            if (ideas.length === 0) return;
            var container = document.getElementById('recent-ideas');
            var list = document.getElementById('recent-list');
            container.style.display = 'block';
            ideas.forEach(function(idea) {
                var a = document.createElement('a');
                a.href = '/idea?id=' + idea.id;
                a.className = 'recent-item';
                var left = document.createElement('div');
                left.className = 'recent-left';
                var statusDot = document.createElement('span');
                var s = idea.status || '';
                var dotColor = s === 'completed' ? '#3fb950' : s === 'analyzing' ? '#d29922' : s === 'failed' ? '#f85149' : '#8b949e';
                statusDot.className = 'status-dot';
                statusDot.style.background = dotColor;
                var title = document.createElement('span');
                title.className = 'recent-title';
                title.textContent = idea.title || '无标题';
                left.appendChild(statusDot);
                left.appendChild(title);
                var time = document.createElement('span');
                time.className = 'recent-time';
                if (idea.created_at) {
                    var d = new Date(idea.created_at);
                    time.textContent = d.toLocaleDateString();
                }
                a.appendChild(left);
                a.appendChild(time);
                list.appendChild(a);
            });
        } catch(e) { console.error('加载最近项目失败', e); }
    })();

    // 快速抓取
    async function fetchPatent() {
        const num = document.getElementById('fetch-number').value;
        const source = document.getElementById('fetch-source').value;
        const el = document.getElementById('fetch-result');
        if (!num) return;
        el.innerHTML = '';
        var fetchingP = document.createElement('p');
        fetchingP.className = 'muted';
        fetchingP.textContent = '正在抓取...';
        el.appendChild(fetchingP);
        try {
            const resp = await fetch('/api/patent/fetch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({patent_number: num, source})
            });
            if (!resp.ok) throw new Error('服务器错误 (' + resp.status + ')');
            const data = await resp.json();
            if (data.status === 'ok') {
                el.innerHTML = '';
                var successP = document.createElement('p');
                successP.className = 'fetch-ok';
                successP.textContent = '已抓取: ' + (data.patent.title || num) + ' ';
                var detailLink = document.createElement('a');
                detailLink.href = '/patent/' + data.patent.id;
                detailLink.textContent = '查看详情';
                successP.appendChild(detailLink);
                el.appendChild(successP);
            } else {
                el.innerHTML = '';
                var errP = document.createElement('p');
                errP.className = 'fetch-err';
                errP.textContent = data.message;
                el.appendChild(errP);
            }
        } catch(e) {
            el.innerHTML = '';
            var catchP = document.createElement('p');
            catchP.className = 'fetch-err';
            catchP.textContent = '请求失败: ' + e;
            el.appendChild(catchP);
        }
    }

    </script>
</body>
</html>
