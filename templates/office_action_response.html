<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OA答复 - 创研台</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <script src="/static/purify.min.js"></script>
</head>
<body>
    <div class="page-with-sidebar">
    <aside id="page-sidebar" class="page-sidebar"></aside>
    <main class="container page-main" style="max-width:1100px;">
        <div class="page-title-bar"><h2 data-i18n="oar.title"></h2></div>

        <!-- OA 历史轮次选择器 -->
        <div id="oa-round-selector" class="cmp-section" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; margin-bottom: 8px; background: #f0f4ff; border-radius: 6px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label data-i18n="oa.workflow.round" style="font-weight: 500;"></label>
                <select id="oa-round-select" onchange="loadSelectedRound()" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="">--</option>
                </select>
            </div>
            <button class="btn-primary" onclick="createOaRoundFromPage()" data-i18n="oa.workflow.newRound" style="padding: 4px 12px; font-size: 13px;"></button>
        </div>

        <!-- OA Type Selector -->
        <div class="cmp-section cmp-oa-violet">
            <label class="cmp-label violet" data-i18n="oar.typeLabel"></label>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <label class="oa-type-option" id="oa-type-first-exam">
                    <input type="radio" name="oa_type" value="first_exam" checked>
                    <span data-i18n="oar.typeFirstExam"></span>
                </label>
                <label class="oa-type-option" id="oa-type-abnormal">
                    <input type="radio" name="oa_type" value="abnormal">
                    <span data-i18n="oar.typeAbnormal"></span>
                </label>
                <label class="oa-type-option" id="oa-type-reject-review">
                    <input type="radio" name="oa_type" value="reject_review">
                    <span data-i18n="oar.typeRejectReview"></span>
                </label>
                <label class="oa-type-option" id="oa-type-second-rejection">
                    <input type="radio" name="oa_type" value="second_rejection">
                    <span data-i18n="oar.typeSecondRejection"></span>
                </label>
                <label class="oa-type-option" id="oa-type-reexamination-request">
                    <input type="radio" name="oa_type" value="reexamination_request">
                    <span data-i18n="oar.typeReexaminationRequest"></span>
                </label>
                <label class="oa-type-option" id="oa-type-reexamination-decision">
                    <input type="radio" name="oa_type" value="reexamination_decision">
                    <span data-i18n="oar.typeReexaminationDecision"></span>
                </label>
                <label class="oa-type-option" id="oa-type-admin-lawsuit">
                    <input type="radio" name="oa_type" value="admin_lawsuit">
                    <span data-i18n="oar.typeAdminLawsuit"></span>
                </label>
            </div>
        </div>

        <!-- My Patent -->
        <div class="cmp-section cmp-my">
            <label class="cmp-label orange" data-i18n="oar.myPatent"></label>
            <div class="my-input-row">
                <input type="text" id="my-patent" class="cmp-input" data-i18n-placeholder="oar.myPatentPlaceholder">
                <button class="btn-upload" onclick="uploadMyPatent()">📎 <span data-i18n="common.upload"></span></button>
                <button class="btn-paste" onclick="pasteMyPatent()">📋 <span data-i18n="common.paste"></span></button>
                <button class="btn-add" onclick="lookupMyPatent()">🔍 <span data-i18n="oar.lookup"></span></button>
            </div>
            <div id="my-file-tag"></div>
        </div>

        <!-- P0a: Deadline Countdown -->
        <div class="cmp-section cmp-oa-orange" id="deadline-section" style="display:none;">
            <label class="cmp-label orange">⏰ <span data-i18n="oar.deadlineTitle"></span></label>
            <div class="oa-inline-row">
                <span class="muted" data-i18n="oar.deadlineLabel"></span>
                <input type="date" id="oa-date" style="width:auto;">
                <span id="deadline-info" class="muted"></span>
            </div>
        </div>

        <!-- Office Action Text -->
        <div class="cmp-section cmp-oa-red">
            <label class="cmp-label red" data-i18n="oar.oaLabel"></label>
            <div class="my-input-row">
                <input type="text" id="oa-input" class="cmp-input" disabled data-i18n-placeholder="oar.oaPlaceholder" style="flex:1;">
                <button class="btn-upload" onclick="uploadOA()">📎 <span data-i18n="common.upload"></span></button>
                <button class="btn-paste" onclick="pasteOA()">📋 <span data-i18n="common.paste"></span></button>
            </div>
            <div id="oa-file-tag"></div>
        </div>

        <!-- Reference Documents -->
        <div class="cmp-section cmp-ref">
            <label class="cmp-label blue" data-i18n="oar.refLabel"></label>
            <div id="ref-list">
                <div class="ref-row" data-idx="0">
                    <input type="text" class="cmp-input ref-input" data-i18n-placeholder="oar.refPlaceholder">
                    <button class="btn-upload" onclick="uploadRef(this)">📎 <span data-i18n="common.upload"></span></button>
                    <button class="btn-paste" onclick="pasteRef(this)">📋 <span data-i18n="common.paste"></span></button>
                    <button class="btn-add" onclick="lookupRef(this)">🔍 <span data-i18n="oar.lookup"></span></button>
                    <button class="btn-remove" onclick="removeRef(this)" title="移除">&times;</button>
                </div>
            </div>
            <button class="btn-add" onclick="addRef()" id="btn-add-ref">+ <span data-i18n="oar.addRef"></span></button>
        </div>
            <!-- T1: 自动获取对比文献 -->
            <button class="btn-secondary" onclick="autoFetchRefs()" id="btn-auto-fetch-refs" style="margin-left:8px;">🔍 <span data-i18n="oa.refs.autoFetch">自动获取对比文献</span></button>
            <div id="auto-fetch-refs-result" style="margin-top:8px;"></div>

        <!-- Depth Selector + Action Buttons -->
        <div class="btn-row">
            <button class="btn-primary" id="btn-analyze" onclick="doOAAnalysis()" data-i18n="oar.btnAnalyze"></button>
            <button class="btn-secondary" onclick="showOADiscussImportDialog()" style="margin-left:8px;" data-i18n="oar.discussImport">📥 导入讨论</button>
            <button class="btn-secondary" onclick="showOaPanel()" id="btn-oa-panel" style="margin-left:8px;">🎭 <span data-i18n="oa.panel.btn">多角色会诊</span></button>
            <button class="btn-secondary" onclick="examinerPreview()" id="btn-examiner-preview" style="margin-left:8px;">🔍 <span data-i18n="oa.preview.btn">模拟审查员预判</span></button>
            <button class="btn-secondary" onclick="defenseAnalysis()" id="btn-defense-analysis" style="margin-left:8px;">🛡️ <span data-i18n="oa.defense.btn">对方视角防御</span></button>
            <button class="btn-secondary" onclick="recommendStrategy()" id="btn-strategy-recommend" style="margin-left:8px;">💡 <span data-i18n="oa.strategy.btn">智能推荐策略</span></button>
            <button class="btn-secondary" onclick="qualityScore()" id="btn-quality-score" style="margin-left:8px;">📊 <span data-i18n="oa.quality.btn">质量评估</span></button>
            <button class="btn-secondary" onclick="openClaimSimulator()" id="btn-claim-sim" style="margin-left:8px;">🔧 <span data-i18n="oa.claimSim.title">权利要求修改模拟器</span></button>
            <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
                <span class="muted" data-i18n="oar.depthLabel"></span>
                <select id="depth-select" class="depth-select">
                    <option value="shallow" data-i18n="oar.depthShallow"></option>
                    <option value="medium" selected data-i18n="oar.depthMedium"></option>
                    <option value="deep" data-i18n="oar.depthDeep"></option>
                </select>
            </div>
        </div>

        <div id="result"></div>
        <!-- P2-T1: 多角色会诊面板 -->
        <div id="oa-panel-container" style="display:none;margin-top:16px;"></div>

        <!-- AI Discussion Panel -->
        <div class="discussion-panel hidden" id="discussion-panel">
            <div class="discussion-header" data-i18n="oar.discussTitle"></div>
            <!-- 论点看板 / Argument Board -->
            <div id="arg-board" class="arg-board" style="display:none;">
                <div class="arg-board-header">
                    <span class="arg-title">📋 <span data-i18n="oar.argTitle"></span></span>
                    <span class="arg-extract" onclick="extractArgConclusions()" id="btn-extract-args">📝 <span data-i18n="oar.extractArgs"></span></span>
                </div>
                <div id="arg-list" style="display:flex;flex-direction:column;gap:6px;"></div>
            </div>
            <div class="discussion-messages" id="discussion-messages"></div>
            <div class="discussion-input-row">
                <input type="text" id="discussion-input" data-i18n-placeholder="oar.discussInput" onkeydown="if(event.key==='Enter') sendDiscussionMessage()">
                <button id="discussion-send-btn" onclick="sendDiscussionMessage()" data-i18n="oar.send"></button>
                <button id="discussion-cad-btn" type="button" onclick="drawOaCad()" data-i18n="cad.draw"></button>
                <button id="discussion-stop-btn" class="btn-stop" style="display:none" onclick="stopDiscussionGeneration()" data-i18n="oar.stop"></button>
                <button id="discussion-export-btn" class="btn-export-ghost" disabled style="opacity:0.4;cursor:not-allowed;" onclick="exportDiscussionConclusions()" data-i18n="oar.exportConclusions"></button>
                <button id="discussion-transcript-export-btn" class="btn-export-ghost" disabled style="opacity:0.4;cursor:not-allowed;" onclick="exportDiscussionTranscript()" data-i18n="oar.exportTranscript"></button>
            </div>
        </div>

        <!-- P2: Claim Amendment Assistant -->
        <div class="cmp-section cmp-oa-green" id="amendment-section" style="display:none;">
            <label class="cmp-label green">✏️ <span data-i18n="oar.amendTitle"></span></label>
            <div style="margin-bottom:8px;">
                <textarea id="claims-editor" class="claim-editor"></textarea>
            </div>
            <div class="btn-row">
                <button class="btn-add" onclick="checkAmendments()" id="btn-check-amendments">🔍 <span data-i18n="oar.checkAmendments"></span></button>
                <button class="btn-add" onclick="showClaimDiff()" style="border-color:var(--green);color:var(--green);">📊 <span data-i18n="oar.showDiff"></span></button>
                <span class="muted" data-i18n="oar.amendHint"></span>
            </div>
            <div id="amendment-result"></div>
        </div>

        <!-- P3: Argument Library -->
        <div class="cmp-section cmp-oa-yellow" id="lib-section">
            <label class="cmp-label yellow" style="cursor:pointer;" onclick="toggleArgLib()">📚 <span data-i18n="oar.libTitle"></span> <span id="lib-toggle" class="lib-toggle">▼</span></label>
            <div id="lib-content" class="oa-content" style="margin-top:8px;"></div>
        </div>

        <!-- P4: Checklist -->
        <div class="cmp-section cmp-oa-blue" id="checklist-section" style="display:none;">
            <label class="cmp-label blue">✅ <span data-i18n="oar.checklistTitle"></span></label>
            <div id="checklist-content" class="oa-content"></div>
        </div>

        <!-- P1a: Mapping Matrix -->
        <div class="cmp-section cmp-oa-violet" id="matrix-section" style="display:none;">
            <label class="cmp-label violet">📊 <span data-i18n="oar.matrixTitle"></span></label>
            <div id="matrix-content" class="oa-content" style="overflow-x:auto;"></div>
        </div>
    </main>
    </div>

    <!-- Paste Text Modal -->
    <div class="paste-modal-overlay" id="paste-modal">
        <div class="paste-modal">
            <h3 id="paste-modal-title" data-i18n="oar.pasteTitle"></h3>
            <input type="text" class="paste-title-input" id="paste-title" data-i18n-placeholder="oar.pasteTitlePlaceholder">
            <textarea id="paste-content" data-i18n-placeholder="oar.pasteContentPlaceholder"></textarea>
            <div class="modal-btns">
                <button class="btn-modal-cancel" onclick="closePasteModal()" data-i18n="common.cancel"></button>
                <button class="btn-modal-ok" onclick="confirmPaste()" data-i18n="common.confirm"></button>
            </div>
        </div>
    </div>

    <!-- PDF Preview Modal -->
    <div class="pdf-modal-overlay" id="pdf-preview-modal">
        <div class="pdf-modal">
            <button class="pdf-modal-close" onclick="closePdfPreview()">&times;</button>
            <iframe id="pdf-preview-iframe" src="about:blank"></iframe>
        </div>
    </div>

    <script src="/static/i18n.js"></script>
    <script src="/static/cad.js"></script>
    <script>
    // Ensure DOMPurify never throws even if script failed to load
    if (typeof DOMPurify === 'undefined' || typeof DOMPurify.sanitize !== 'function') {
        window.DOMPurify = { sanitize: function(html) {
            return html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                       .replace(/on\w+="[^"]*"/gi, '').replace(/on\w+='[^']*'/gi, '');
        }};
    }
    // Allow inline event handlers in sanitized HTML (needed for dynamically generated UI buttons)
    if (typeof DOMPurify !== 'undefined' && DOMPurify.setConfig) {
        DOMPurify.setConfig({ADD_ATTR: ['onclick', 'onkeydown', 'onchange', 'oninput', 'onload', 'onfocus', 'onblur']});
    }

    // ── OA Type Label Helpers ──
    function getResponseButtonText() {
        var checked = document.querySelector('input[name="oa_type"]:checked');
        var oaType = checked ? checked.value : 'first_exam';
        if (oaType === 'reject_review' || oaType === 'reexamination_request') {
            return '📝 ' + (t('oar.btnGenerateReexamReq') || '生成复审请求书');
        }
        if (oaType === 'reexamination_decision') {
            return '📝 ' + (t('oar.btnGenerateReexamDecision') || '生成复审决定答复');
        }
        if (oaType === 'admin_lawsuit') {
            return '📝 ' + (t('oar.btnGenerateAdminLawsuit') || '生成行政诉讼起诉状');
        }
        return '📝 ' + (t('oar.btnGenerateResponse') || '生成答复书');
    }

    function getSection5Title() {
        var checked = document.querySelector('input[name="oa_type"]:checked');
        var oaType = checked ? checked.value : 'first_exam';
        if (oaType === 'reject_review' || oaType === 'reexamination_request') {
            return t('oar.section5Reexam') || '复审请求书草稿';
        }
        if (oaType === 'reexamination_decision') {
            return t('oar.section5ReexamDecision') || '复审决定答复草稿';
        }
        if (oaType === 'admin_lawsuit') {
            return t('oar.section5AdminLawsuit') || '行政诉讼起诉状草稿';
        }
        return t('oar.section5') || '意见陈述书草稿';
    }

    function getGenerateHintText() {
        var checked = document.querySelector('input[name="oa_type"]:checked');
        var oaType = checked ? checked.value : 'first_exam';
        if (oaType === 'reject_review' || oaType === 'reexamination_request') {
            return t('oar.generateHintReexam') || '确认分析无误后可生成正式复审请求书';
        }
        if (oaType === 'reexamination_decision') {
            return t('oar.generateHintReexamDecision') || '确认分析无误后可生成正式复审决定答复';
        }
        if (oaType === 'admin_lawsuit') {
            return t('oar.generateHintAdminLawsuit') || '确认分析无误后可生成正式行政诉讼起诉状';
        }
        return t('oar.generateHint') || '确认分析无误后可生成正式答复书';
    }

    // ── PDF Preview ──
    var uploadedFileObjects = {};

    function showPdfPreview(url) {
        document.getElementById('pdf-preview-iframe').src = url;
        document.getElementById('pdf-preview-modal').classList.add('show');
    }

    function closePdfPreview() {
        document.getElementById('pdf-preview-modal').classList.remove('show');
        document.getElementById('pdf-preview-iframe').src = 'about:blank';
    }

    document.getElementById('pdf-preview-modal').addEventListener('click', function(e) {
        if (e.target === this) closePdfPreview();
    });

    async function uploadAndPreviewPdf(file) {
        var form = new FormData();
        form.append('file', file);
        try {
            var resp = await fetch('/api/upload/pdf-store', { method: 'POST', body: form });
            if (!resp.ok) throw new Error('upload failed (' + resp.status + ')');
            var data = await resp.json();
            if (data.status === 'ok' && data.url) {
                showPdfPreview(data.url);
            } else {
                alert(data.message || 'PDF store failed');
            }
        } catch (e) {
            alert('PDF preview failed: ' + e.message);
        }
    }

    function previewPdfByKey(key) {
        var file = uploadedFileObjects[key];
        if (file) uploadAndPreviewPdf(file);
    }

    // ── State (persisted to sessionStorage, survives page refresh) ──
    var OA_STORAGE_KEY = 'innoforge_oa_data';
    var uploadedData = {};
    var refIdxCounter = 0;
    var lastAnalysisRawText = '';
    var discussionHistory = [];
    var discussionAbortController = null;
    var discussionSending = false;
    function oaCadContextId() {
        var id = localStorage.getItem('oa-discuss-id');
        if (!id) {
            id = 'disc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('oa-discuss-id', id);
        }
        return id;
    }
    var oaCadController = window.InnoForgeCad.createController({
        context: function() { return { kind: 'oa', id: oaCadContextId() }; },
        input: function() { return document.getElementById('discussion-input'); },
        messages: function() { return document.getElementById('discussion-messages'); },
        history: function() { return JSON.stringify(discussionHistory); },
        onContinue: function() {
            var input = document.getElementById('discussion-input');
            input.value = t('cad.continuePrompt'); input.focus();
        }
    });
    function drawOaCad() { oaCadController.drawFromInput(); }
    oaCadController.restore();

    function saveOaState() {
        try { localStorage.setItem(OA_STORAGE_KEY, JSON.stringify(_uploadedData)); } catch (e) { /* ignore */ }
    }
    // uploadedData 用 Proxy 包装，任何修改自动持久化到 localStorage（关页面不丢）
    var _uploadedData = {};
    try { if (localStorage.getItem('innoforge_oa_data')) { _uploadedData = JSON.parse(localStorage.getItem('innoforge_oa_data')); } } catch (e) { _uploadedData = {}; }
    // Proxy 仅拦截 set/delete 触发自动保存；get/遍历等操作直接转发到 target
    var uploadedData = new Proxy(_uploadedData, {
        set: function(target, key, value) { target[key] = value; saveOaState(); return true; },
        deleteProperty: function(target, key) { delete target[key]; saveOaState(); return true; },
    });

    function loadOaState() {
        try {
            var saved = localStorage.getItem(OA_STORAGE_KEY);
            if (saved) {
                var data = JSON.parse(saved);
                Object.keys(data).forEach(function(k) { _uploadedData[k] = data[k]; });
                restoreOaUi();
            }
        } catch (e) { /* ignore */ }
    }

    function clearOaState() {
        try { localStorage.removeItem(OA_STORAGE_KEY); } catch (e) { /* ignore */ }
    }

    function restoreOaUi() {
        for (let key in _uploadedData) {
            if (key === 'my') {
                document.getElementById('my-patent').disabled = true;
                var d = uploadedData[key];
                document.getElementById('my-file-tag').innerHTML = '<span class="file-tag">📋 ' + escapeHtml(d.title)
                    + ' (' + (d.content || '').length + t('common.chars') + ')'
                    + '<span class="tag-remove" onclick="clearMyPatent()">&times;</span></span>';
            } else if (key === 'oa') {
                document.getElementById('oa-input').disabled = true;
                var d = uploadedData[key];
                document.getElementById('oa-file-tag').innerHTML = '<span class="file-tag">📋 ' + escapeHtml(d.title)
                    + ' (' + (d.content || '').length + t('common.chars') + ')'
                    + '<span class="tag-remove" onclick="clearOA()">&times;</span></span>';
            } else if (key.startsWith('ref_')) {
                var idx = key.replace('ref_', '');
                var rows = document.querySelectorAll('.ref-row');
                for (let i = 0; i < rows.length; i++) {
                    if (rows[i].getAttribute('data-idx') === idx) {
                        rows[i].querySelector('.ref-input').disabled = true;
                        var d = uploadedData[key];
                        var tag = rows[i].querySelector('.file-tag-container') || document.createElement('span');
                        tag.className = 'file-tag-container';
                        tag.innerHTML = '<span class="file-tag">📋 ' + escapeHtml(d.title)
                            + ' (' + (d.content || '').length + t('common.chars') + ')'
                            + '<span class="tag-remove" onclick="clearRefUpload(\'' + idx + '\')">&times;</span></span>';
                        rows[i].appendChild(tag);
                        break;
                    }
                }
            }
        }
    }

    // ── Helpers ──
    function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function getPatentNumberFromUrl() {
        // 优先从 URL 参数读取
        var params = new URLSearchParams(window.location.search);
        var pn = params.get('patent_id');
        if (pn) return pn;
        // 其次从页面 DOM 读取（专利详情页跳转过来时会有 patent-number 元素）
        var el = document.getElementById('patent-number-value');
        if (el && el.textContent) return el.textContent.trim();
        // 最后从 localStorage 读取（OA 页面上保存的专利号）
        if (typeof uploadedData !== 'undefined' && uploadedData['patent_number']) return uploadedData['patent_number'];
        // 从 localStorage OA 数据中读取
        try {
            var oaData = JSON.parse(localStorage.getItem('innoforge_oa_data') || '{}');
            if (oaData['my']) {
                var title = oaData['my'].title || '';
                // 从标题中提取专利号（格式："CN1234567 — 标题"）
                var parts = title.split('—');
                if (parts.length > 0) return parts[0].trim();
            }
        } catch (e) {}
        // 从 OA 文件标题中提取专利号（格式："王青芝 2022104773249 二审.pdf"）
        if (typeof uploadedData !== 'undefined' && uploadedData['oa']) {
            var oaTitle = uploadedData['oa'].title || '';
            var numMatch = oaTitle.match(/\b\d{10,}\b/);
            if (numMatch) return numMatch[0];
        }
        // 从本申请输入框读取
        var myInput = document.getElementById('my-patent');
        if (myInput && myInput.value.trim().length > 3) return myInput.value.trim();
        return '';
    }

    function triggerFileSelect(callback) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.docx,.txt';
        input.onchange = function() {
            if (input.files.length > 0) callback(input.files[0]);
        };
        input.click();
    }

    async function extractFile(file) {
        var form = new FormData();
        form.append('file', file);
        var resp = await fetch('/api/upload/extract', { method: 'POST', body: form });
        var data = await resp.json();
        if (data.error) throw new Error(data.error);
        return { title: file.name, content: data.text };

    // Auto-detect patent number + OA date from OA text
    function autoDetectPatentFromOA(oaText) {
        if (!oaText) return;
        // --- Patent number ---
        var patterns = [
            /CN\s*(\d{7,13}(?:\.\d)?)/i,
            /ZL\s*(\d{7,13}(?:\.\d)?)/i,
            /申请号[：:]\s*(\d{7,13}(?:\.\d)?)/,
            /专利号[：:]\s*(\d{7,13}(?:\.\d)?)/,
            /(\d{13}(?:\.\d)?)/,
        ];
        var patentNum = null;
        for (let i = 0; i < patterns.length; i++) {
            var m = oaText.match(patterns[i]);
            if (m && m[1]) { patentNum = m[1].replace(/\s/g, ''); break; }
        }
        if (patentNum && patentNum.length >= 9) {
            var existing = document.getElementById('my-patent').value.trim();
            if (!existing || existing.length <= 5) {
                document.getElementById('my-patent').value = patentNum;
                lookupMyPatent();
            }
        }

        // --- OA date ---
        var datePatterns = [
            /发文日[：:]\s*(\d{4})\s*[年\-]\s*(\d{1,2})\s*[月\-]\s*(\d{1,2})\s*日?/,
            /(\d{4})\s*[年\-]\s*(\d{1,2})\s*[月\-]\s*(\d{1,2})\s*日?/,
            /(\d{4})-(\d{1,2})-(\d{1,2})/,
        ];
        for (let j = 0; j < datePatterns.length; j++) {
            var dm = oaText.match(datePatterns[j]);
            if (dm && dm[1]) {
                var year = dm[1];
                var month = dm[2].padStart(2, '0');
                var day = dm[3].padStart(2, '0');
                var dateStr = year + '-' + month + '-' + day;
                var oaDateInput = document.getElementById('oa-date');
                if (oaDateInput && !oaDateInput.value) {
                    oaDateInput.value = dateStr;
                    oaDateInput.dispatchEvent(new Event('change'));
                }
                break;
            }
        }
    }

    function renderRadarChart(dims, scores) {
        var cx = 120, cy = 120, maxR = 90;
        var n = dims.length;
        var html = '<svg width="240" height="240" viewBox="0 0 240 240">';
        for (var r = 1; r <= 5; r++) {
            var rad = maxR * r / 5;
            var points = [];
            for (var i = 0; i < n; i++) {
                var angle = -Math.PI / 2 + 2 * Math.PI * i / n;
                points.push((cx + rad * Math.cos(angle)) + ',' + (cy + rad * Math.sin(angle)));
            }
            html += '<polygon points="' + points.join(' ') + '" fill="none" stroke="#30363d" stroke-width="1"/>';
        }
        for (var i = 0; i < n; i++) {
            var angle = -Math.PI / 2 + 2 * Math.PI * i / n;
            var x2 = cx + maxR * Math.cos(angle);
            var y2 = cy + maxR * Math.sin(angle);
            html += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#30363d" stroke-width="1"/>';
            var lx = cx + (maxR + 15) * Math.cos(angle);
            var ly = cy + (maxR + 15) * Math.sin(angle);
            var label = dims[i].label;
            if (label.length > 4) label = label.substring(0, 4);
            html += '<text x="' + lx + '" y="' + ly + '" fill="#8b949e" font-size="10" text-anchor="middle" dominant-baseline="middle">' + escapeHtml(label) + '</text>';
        }
        var dataPoints = [];
        for (var i = 0; i < n; i++) {
            var val = scores[dims[i].key] || 0;
            var rad = maxR * val / 10;
            var angle = -Math.PI / 2 + 2 * Math.PI * i / n;
            dataPoints.push((cx + rad * Math.cos(angle)) + ',' + (cy + rad * Math.sin(angle)));
        }
        html += '<polygon points="' + dataPoints.join(' ') + '" fill="rgba(88,166,255,0.2)" stroke="#58a6ff" stroke-width="2"/>';
        for (var i = 0; i < n; i++) {
            var val = scores[dims[i].key] || 0;
            var rad = maxR * val / 10;
            var angle = -Math.PI / 2 + 2 * Math.PI * i / n;
            html += '<circle cx="' + (cx + rad * Math.cos(angle)) + '" cy="' + (cy + rad * Math.sin(angle)) + '" r="3" fill="#58a6ff"/>';
        }
        html += '</svg>';
        return html;
    }

        var angle = function(i) { return -Math.PI / 2 + (2 * Math.PI * i / n); };
        var point = function(i, radius) { return [cx + radius * Math.cos(angle(i)), cy + radius * Math.sin(angle(i))]; };
        var svg = '<svg width="' + size + '" height="' + size + '" style="display:block;margin:0 auto;">';
        // 网格
        for (var g = 1; g <= 5; g++) {
            var gr = r * g / 5;
            var pts = [];
            for (var i = 0; i < n; i++) { var p = point(i, gr); pts.push(p[0] + ',' + p[1]); }
            svg += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#30363d" stroke-width="1"/>';
        }
        // 轴线 + 标签
        for (var i = 0; i < n; i++) {
            var p = point(i, r);
            svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#30363d" stroke-width="1"/>';
            var lp = point(i, r + 18);
            svg += '<text x="' + lp[0] + '" y="' + lp[1] + '" text-anchor="middle" dominant-baseline="middle" fill="#8b949e" font-size="10">' + labels[i] + '</text>';
        }
        // 数据多边形
        var dpts = [];
        for (var i = 0; i < n; i++) { var p = point(i, r * Math.min(values[i] / 10, 1)); dpts.push(p[0] + ',' + p[1]); }
        svg += '<polygon points="' + dpts.join(' ') + '" fill="rgba(88,166,255,0.2)" stroke="#58a6ff" stroke-width="2"/>';
        // 数据点
        for (var i = 0; i < n; i++) { var p = point(i, r * Math.min(values[i] / 10, 1)); svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#58a6ff"/>'; }
        svg += '</svg>';
        return svg;
    }

    function autoExtractPublicationNumbers(text) {
        var patterns = [
            /CN\d{8,12}[A-Z]\d?/g,
            /US\d{6,12}[A-Z]\d?/g,
            /EP\d{6,8}[A-Z]\d?/g,
            /JP\d{4,8}[A-Z]/g,
            /KR\d{6,10}[A-Z]/g,
            /WO\d{4}\/\d{4,6}[A-Z]\d?/g
        ];
        var contextPattern = /(?:对比文件|引证文献|D|参考文献)\s*[1-9]\s*[:：]/g;
        var contextPositions = [];
        var m;
        while ((m = contextPattern.exec(text)) !== null) {
            contextPositions.push(m.index);
        }
        var results = [];
        var seen = {};
        patterns.forEach(function(pat) {
            pat.lastIndex = 0;
            while ((m = pat.exec(text)) !== null) {
                var pubNum = m[0];
                var pubStart = m.index;
                var nearContext = contextPositions.some(function(cp) {
                    return Math.abs(pubStart - cp) < 80;
                });
                if (nearContext && !seen[pubNum]) {
                    seen[pubNum] = true;
                    results.push(pubNum);
                }
            }
        });
        return results;
    }

    function getRefs() {
        var refs = [];
        var inputs = document.querySelectorAll('.ref-input');
        var rows = document.querySelectorAll('.ref-row');
        for (let i = 0; i < rows.length; i++) {
            var idx = rows[i].getAttribute('data-idx');
            if (uploadedData['ref_' + idx]) {
                refs.push(uploadedData['ref_' + idx]);
            } else {
                var val = inputs[i] ? inputs[i].value.trim() : '';
                if (val) refs.push(val);
            }
        }
        // UA1: 自动检测 OA 文本中的公开号，补充用户未手贴的对比文件
        var oaText = '';
        var oaInput = document.getElementById('oa-text');
        if (oaInput) oaText = oaInput.value || '';
        if (oaText.length > 50) {
            var autoPubs = autoExtractPublicationNumbers(oaText);
            autoPubs.forEach(function(pub) {
                // 仅添加用户未手贴的公开号
                var alreadyIncluded = refs.some(function(r) {
                    return typeof r === 'string' && r.indexOf(pub) >= 0;
                });
                if (!alreadyIncluded) {
                    refs.push(pub);
                }
            });
        }
        return refs;
    }

    // ── Markdown Renderer ──
    function renderMarkdown(text) {
        if (!text) return '';
        var codeBlocks = [];
        text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
            codeBlocks.push('<pre style="background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px;overflow-x:auto;font-size:0.85em;"><code>' + escapeHtml(code) + '</code></pre>');
            return '\x00CB' + (codeBlocks.length - 1) + '\x00';
        });
        var tableBlocks = [];
        // Match standard markdown tables: header | sep | body
        text = text.replace(/(?:^|\n)(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)+)/gm, function(_, header, sep, body) {
            var ths = header.split('|').filter(function(c) { return c.trim() !== ''; });
            var rows = body.trim().split('\n');
            var html = '<div class="oa-table-scroll"><table><thead><tr>';
            for (let i = 0; i < ths.length; i++) html += '<th style="background:#21262d;color:#c9d1d9;padding:8px 10px;border:1px solid #30363d;">' + escapeHtml(ths[i].trim()) + '</th>';
            html += '</tr></thead><tbody>';
            for (let r = 0; r < rows.length; r++) {
                var cells = rows[r].split('|').filter(function(c) { return c.trim() !== ''; });
                html += '<tr>';
                for (let c = 0; c < cells.length; c++) html += '<td style="padding:8px 10px;border:1px solid #30363d;">' + escapeHtml(cells[c].trim()).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            tableBlocks.push(html);
            return '\n\x00TB' + (tableBlocks.length - 1) + '\x00\n';
        });
        // Match tables without separator row (>=2 pipe-delimited lines, each starts with |)
        text = text.replace(/(?:^|\n)((?:\|.+\|\n?){2,})/gm, function(_, block) {
            var lines = block.trim().split('\n').filter(function(l) { return l.trim().startsWith('|'); });
            if (lines.length < 2) return _; // need at least header + 1 row
            // Check if any line looks like a separator (mostly dashes between pipes)
            var dataLines = lines.filter(function(l) { return !/^\|[\s:|-]+\|$/.test(l.trim()); });
            if (dataLines.length < 2) return _; // after removing separators, need at least header + 1 row
            var ths = dataLines[0].split('|').filter(function(c) { return c.trim() !== ''; });
            var html = '<div class="oa-table-scroll"><table><thead><tr>';
            for (let i = 0; i < ths.length; i++) html += '<th style="background:#21262d;color:#c9d1d9;padding:8px 10px;border:1px solid #30363d;">' + escapeHtml(ths[i].trim()) + '</th>';
            html += '</tr></thead><tbody>';
            for (let r = 1; r < dataLines.length; r++) {
                var cells = dataLines[r].split('|').filter(function(c) { return c.trim() !== ''; });
                html += '<tr>';
                for (let c = 0; c < cells.length; c++) html += '<td style="padding:8px 10px;border:1px solid #30363d;">' + escapeHtml(cells[c].trim()).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            tableBlocks.push(html);
            return '\n\x00TB' + (tableBlocks.length - 1) + '\x00\n';
        });
        var result = escapeHtml(text)
            .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/`([^`]+)`/g, '<code style="background:#21262d;padding:1px 5px;border-radius:3px;font-size:0.9em;">$1</code>')
            .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#f0883e;">$1</strong>')
            .replace(/^\- (.+)$/gm, '<li>$1</li>')
            .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
            .replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>')
            .replace(/<\/ul>\s*<ul>/g, '')
            .replace(/\n{2,}/g, '</p><p>')
            .replace(/\n/g, '<br>');
        result = result.replace(/\x00CB(\d+)\x00/g, function(_, i) { return codeBlocks[parseInt(i)]; });
        result = result.replace(/\x00TB(\d+)\x00/g, function(_, i) { return tableBlocks[parseInt(i)]; });
        return result;
    }

    // ── Main OA Analysis (SSE streaming with fallback) ──
    async function doOAAnalysis() {
        var my = getMyPatent();
        var oa = getOA();
        var refs = getRefs();
        var oaType = document.querySelector('input[name="oa_type"]:checked').value;
        var depth = document.getElementById('depth-select').value;

        var typeName = typeLabel ? typeLabel.textContent : oaType;

        var body = { references: refs, office_action: oa, oa_type: oaType, depth: depth, discuss: true };

        // T3: 二审驳回时自动获取一审历史上下文
        if (oaType === 'second_rejection') {
            var pnForDiff = null;
            if (typeof my === 'object' && my.patent_number) {
                pnForDiff = my.patent_number;
            } else if (typeof my === 'string') {
                pnForDiff = my;
            } else if (my && my.content) {
                var m = my.content.match(/\b((?:CN|US|EP|JP|KR|WO)\d{7,12}(?:[.]?\d)?)\b/i);
                if (m) pnForDiff = m[1];
            }
            if (pnForDiff) {
                try {
                    var diffResp = await fetch('/api/oa/history/' + encodeURIComponent(pnForDiff) + '/diff');
                    var diffData = await diffResp.json();
                    if (diffData.status === 'ok' && diffData.first_exam_context) {
                        body.first_exam_context = diffData.first_exam_context;
                    }
                    if (diffData.status === 'ok' && diffData.diffs && diffData.diffs.length > 0) {
                        renderOaDiff(diffData.diffs);
                    }
                } catch (e) { /* diff fetch failed, continue without */ }
            }
        }

        if (typeof my === 'string') {
            body.my_patent_id = my;
        } else {
            body.my_patent = my;
            // Extract patent number from uploaded content for auto-save (e.g. CN202310123456)
            var content = my.content || my.title || '';
            var pn = content.match(/\b((?:CN|US|EP|JP|KR|WO)\d{7,12}(?:[.]?\d)?)\b/i);
            if (pn) body.my_patent_id = pn[1];
        }

        // Show streaming-friendly UI
        var container = document.getElementById('result');
        var btn = document.getElementById('btn-analyze');
        if (btn) btn.disabled = true;
        container.innerHTML = DOMPurify.sanitize('<div class="result-box" style="border-color:#30363d;"><div class="result-content" id="streaming-result" style="padding:16px;font-size:13px;line-height:1.8;color:#c9d1d9;white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow-y:auto;font-family:Consolas,monospace;"></div></div>');

        // Try non-streaming POST first (DeepSeek 流式返回内容不同)
        try {
            var resp2 = await fetch('/api/ai/office-action-response', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            var data2 = await resp2.json();
            if (data2.error) throw new Error(data2.error);
            lastAnalysisRawText = data2.analysis || '';
            // Keep every successful analysis path in discussion mode so the
            // response-letter action is always visible after analysis.
            showOAAnalysisDiscuss(data2.analysis);

            numberRefParagraphs();
            extractMappingMatrix(data2.analysis);

            var content2 = (uploadedData['my'] && uploadedData['my'].content) || document.getElementById('my-patent').value || '';
            if (content2) showAmendmentEditor(content2);
            showChecklist();
            loadOaHistory();
        } catch (e) {
            // Fallback: try SSE streaming
            console.warn('Non-streaming POST failed, falling back to SSE streaming:', e.message);
            try {
            var resp = await fetch('/api/ai/office-action-response/stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            if (!resp.body) throw new Error('No ReadableStream support');

            var reader = resp.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';
            var fullText = '';
            var currentEvent = '';
            var streamDiv = document.getElementById('streaming-result');
            var done = false;
            var errored = false;

            while (true) {
                var { done: streamDone, value } = await reader.read();
                if (streamDone) break;

                buffer += decoder.decode(value, { stream: true });

                // Parse SSE events
                var lines = buffer.split('\n');
                buffer = lines.pop(); // Keep incomplete line

                for (let i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line.startsWith('event: ')) {
                        currentEvent = line.slice(7).trim();
                    } else if (line.startsWith('data:')) {
                        var data = line.slice(5).replace(/^ /, '');
                        if (currentEvent === 'error' || data.startsWith('[ERROR]')) {
                            showError(data.replace('[ERROR] ', ''));
                            errored = true;
                            done = true;
                            break;
                        }
                        if (currentEvent === 'done' || data === '[DONE]') {
                            done = true;
                            break;
                        }
                        // Regular text chunk
                        fullText += data;
                        if (streamDiv) {
                            streamDiv.textContent = fullText;
                            streamDiv.scrollTop = streamDiv.scrollHeight;
                        }
                    } else if (line === '' && currentEvent) {
                        // Empty line = end of event; reset for next event
                        currentEvent = '';
                    }
                }
                if (done) break;
            }

            if (!errored && fullText.length > 0) {
                lastAnalysisRawText = fullText;
                // Discuss mode: show sections 1-4 + discussion panel + generate button
                showOAAnalysisDiscuss(fullText);

                // 映射矩阵 + 锚点
                numberRefParagraphs();
                extractMappingMatrix(fullText);

                // 显示权利要求修改助手和检查清单
                var content = (uploadedData['my'] && uploadedData['my'].content) || document.getElementById('my-patent').value || '';
                if (content) showAmendmentEditor(content);
                showChecklist();
                // 刷新历史列表
                loadOaHistory();
            } else if (!errored) {
                showError(t('oar.fail'));
            }
        } catch (e) {
            // Fallback: try non-streaming endpoint
            console.warn('SSE streaming failed, falling back to regular POST:', e.message);
            try {
                var resp2 = await fetch('/api/ai/office-action-response', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                var data2 = await resp2.json();
                if (data2.error) { showError(data2.error); return; }
                lastAnalysisRawText = data2.analysis || '';
                // 统一走 Discuss 模式：显示分析结果 + 讨论区 + 生成按钮（不再无按钮）
                showOAAnalysisDiscuss(data2.analysis);

                numberRefParagraphs();
                extractMappingMatrix(data2.analysis);

                var content2 = (uploadedData['my'] && uploadedData['my'].content) || document.getElementById('my-patent').value || '';
                if (content2) showAmendmentEditor(content2);
                showChecklist();
                loadOaHistory();
            } catch (e2) {
                showError(t('oar.fail') + ': ' + e2.message);
            }
        }
    }
    }

            { key: 'part2', label: t('oar.section2'), color: '#d29922', patterns: ['=== 第二部分', '## 第二部分'] },
            { key: 'mechanism', label: t('oa.mechanism.title'), color: '#39d353', patterns: ['技术机制深度分析', '技术机制对比', '## 一·五'] },
            { key: 'part3', label: t('oar.section3'), color: '#3fb950', patterns: ['=== 第三部分', '## 第三部分', '特征对比表', '特征对比总表'] },
            { key: 'part4', label: t('oar.section4'), color: '#d2a8ff', patterns: ['=== 第四部分', '## 第四部分', '分层反驳', '逐权利要求反驳'] },
            { key: 'part5', label: t('oar.section5'), color: '#f0883e', patterns: ['=== 第五部分', '## 第五部分', '意见陈述书草稿', '意见陈述书', '=== 第五部分'] },
        ];
        var sections = [];
        var remaining = text;

        for (let i = 0; i < sectionMarkers.length; i++) {
            var marker = sectionMarkers[i];
            var startIdx = -1;
            // Find the first matching pattern
            for (let p = 0; p < marker.patterns.length; p++) {
                var idx = remaining.indexOf(marker.patterns[p]);
                if (idx >= 0) { startIdx = idx; break; }
            }
            if (startIdx < 0) continue;

            // Find where this section ends (next marker or end of string)
            var endIdx = remaining.length;
            for (let j = i + 1; j < sectionMarkers.length; j++) {
                for (let p = 0; p < sectionMarkers[j].patterns.length; p++) {
                    var nextIdx = remaining.indexOf(sectionMarkers[j].patterns[p], startIdx + 1);
                    if (nextIdx >= 0 && nextIdx < endIdx) { endIdx = nextIdx; break; }
                }
            }
            var sectionText = remaining.substring(startIdx, endIdx).trim();
            if (sectionText) {
                sections.push({
                    key: marker.key,
                    label: marker.label,
                    color: marker.color,
                    text: sectionText
                });
            }
        }

        return sections;
    }

    async function sendOADiscussion() {
        var input = document.getElementById('oa-discuss-input');
        if (!input) return;
        var msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        if (oaInputHistory) oaInputHistory.push(msg);

        }

        await sendOADiscussionCore(msg);
    }

    async function sendOADiscussionCore(msg) {
        // 获取当前专利信息
        var patentNumber = document.getElementById('patent-number-value');
        var applicantName = document.getElementById('applicant-value');
        var patentNum = patentNumber ? patentNumber.textContent.trim() : '';
        var applicantNm = applicantName ? applicantName.textContent.trim() : '';

        // 生成或获取稳定的 discussion_id（localStorage 持久化）
        var discussionId = localStorage.getItem('oa-discuss-id');
        if (!discussionId) {
            discussionId = 'disc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('oa-discuss-id', discussionId);
        }
        var lsKeyPatent = patentNum ? ('oa-discuss-history-' + patentNum) : '';

        // Add user message
        addDiscussionMessage('user', msg);
        oaDiscussMessages.push({ role: 'user', content: msg, timestamp: new Date().toISOString() });
        // 同步更新 discussionHistory（用于导出）
        if (typeof discussionHistory !== 'undefined') {
            discussionHistory.push(['user', msg, new Date().toISOString()]);
        }

        // Add AI placeholder
        var aiMsgId = addDiscussionMessage('ai', '⏳ ...');
        var aiDiv = document.getElementById(aiMsgId);

        // 如果有上传的文件，也显示到用户消息中
        var pendingFile = window._oaDiscussPendingFile;
        if (pendingFile) {
            var lastUserMsg = document.querySelector('#oa-discuss-messages .msg-bubble:last-of-type');
            if (pendingFile.type && pendingFile.type.startsWith('image/')) {
                if (lastUserMsg) {
                    var img = document.createElement('img');
                    img.src = pendingFile.dataUrl;
                    img.style.cssText = 'max-width:300px;max-height:200px;border-radius:6px;margin-top:8px;display:block;';
                    lastUserMsg.appendChild(img);
                }
            } else {
                if (lastUserMsg) {
                    var fileNote = document.createElement('div');
                    fileNote.style.cssText = 'color:#58a6ff;font-size:12px;margin-top:4px;';
                    fileNote.textContent = '📎 ' + pendingFile.name;
                    lastUserMsg.appendChild(fileNote);
                }
            }
            window._oaDiscussPendingFile = null;
        }

        oaSending = true;
        try {
            var payload = {
                analysis: lastAnalysisRawText,
                discussion: JSON.stringify(oaDiscussMessages.slice(0, -1)),
                message: msg,
                office_action: oaDiscussOAText,
                oa_text: oaDiscussOAText
            };
            // 传入 OA 类型增强上下文
            if (oaDiscussOAType) payload.oa_type = oaDiscussOAType;
            // 传入专利号和讨论 ID
            if (patentNum) payload.patent_number = patentNum;
            if (applicantNm) payload.applicant_name = applicantNm;
            payload.discussion_id = discussionId;
            // 如果有上传的文件，把 base64 内容传给 AI（使用上面缓存的 pendingFile，避免 1237 行清空后读不到）
            var pf = pendingFile;
            if (pf && pf.base64) {
                payload.file_name = pf.name;
                payload.file_base64 = pf.base64;
                payload.file_type = pf.type;
                // 清空待发送文件
                window._oaDiscussPendingFile = null;
            }

            var resp = await fetch('/api/ai/oa-discuss', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            if (!resp.body) throw new Error('No streaming support');

            var reader = resp.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';
            var aiText = '';
            var done = false;
            var currentEvent = '';
            var capturedDiscId = discussionId;

            while (true) {
                var { done: sd, value } = await reader.read();
                if (sd) break;
                buffer += decoder.decode(value, { stream: true });
                var lines = buffer.split('\n');
                buffer = lines.pop();
                for (let i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line.startsWith('event: ')) {
                        currentEvent = line.slice(7).trim();
                    } else if (line.startsWith('data:')) {
                        var data = line.slice(5).replace(/^ /, '');
                        if (currentEvent === 'error' || data.startsWith('[ERROR]')) {
                            aiText = '⚠️ ' + data.replace('[ERROR] ', '');
                            done = true;
                            break;
                        }
                        if (currentEvent === 'done' || data === '[DONE]') {
                            // 从 done 事件中提取后端生成的 discussion_id
                            try {
                                var doneObj = JSON.parse(data);
                                if (doneObj && doneObj.discussion_id) {
                                    capturedDiscId = doneObj.discussion_id;
                                    localStorage.setItem('oa-discuss-id', capturedDiscId);
                                }
                            } catch (_) { /* 忽略解析错误 */ }
                            done = true;
                            break;
                        }
                        aiText += data;
                        if (aiDiv) aiDiv.innerHTML = renderMarkdown(aiText) + '<span style="color:#f0883e;">▌</span>';
                    } else if (line === '' && currentEvent) {
                        currentEvent = '';
                    }
                }
                if (done) break;
            }

            oaDiscussMessages.push({ role: 'assistant', content: aiText, timestamp: new Date().toISOString() });
            if (aiDiv) aiDiv.innerHTML = renderMarkdown(aiText);
            // 同步更新 discussionHistory（用于导出）
            if (typeof discussionHistory !== 'undefined') {
                discussionHistory.push(['assistant', aiText, new Date().toISOString()]);
            }
            updateCurrentOADiscussionExportButton();
            // 持久化完整讨论记录到 localStorage
            var history = {
                discussion_id: capturedDiscId,
                patent_number: patentNum,
                messages: JSON.stringify(oaDiscussMessages),
                oa_text: oaDiscussOAText || '',
                oa_type: oaDiscussOAType || ''
            };
            if (lsKeyPatent) localStorage.setItem(lsKeyPatent, JSON.stringify(history));
        } catch (e) {
            if (aiDiv) aiDiv.innerHTML = '<span style="color:#f85149;">讨论失败: ' + escapeHtml(e.message) + '</span>';
        } finally {
            oaSending = false;
            var inp = document.getElementById('oa-discuss-input');
            if (inp) inp.focus();
            var next = oaChatQueue.dequeue();
            if (next) await sendOADiscussionCore(next);
        }
    }

                '### ' + roleLabel + '（第 ' + (i + 1) + ' 条）',

                '',
                '```text',
                message.content || '',
                '```',
                ''
            );
        }

        var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'innoforge-oa-discussion-' + new Date().toISOString().replace(/[:.]/g, '-') + '.md';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

        var section5Area = document.getElementById('section5-content');

        } else {
            overlayDiv = document.createElement('div');
            overlayDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:10000;display:flex;align-items:center;justify-content:center;padding:40px;overflow:auto;';
            overlayDiv.innerHTML = '<div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;position:relative;">'
                + '<button type="button" onclick="this.closest(\'.oa-response-overlay\').remove()" aria-label="关闭" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#c9d1d9;font-size:24px;cursor:pointer;">&times;</button>'
                + '<h3 style="margin:0 36px 16px 0;color:#58a6ff;">📝 生成中...</h3>'
                + '<div id="overlay-stream" style="color:#c9d1d9;font-family:Consolas,monospace;font-size:14px;white-space:pre-wrap;line-height:1.7;"></div>'
                + '</div>';
            overlayDiv.className = 'oa-response-overlay';
            document.body.appendChild(overlayDiv);
        }

        try {
            var resp = await fetch('/api/ai/oa-generate-response-letter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    analysis: lastAnalysisRawText,
                    discussion: JSON.stringify(oaDiscussMessages),
                    office_action: oaDiscussOAText,
                    oa_type: oaDiscussOAType,
                    discussion_id: localStorage.getItem('oa-discuss-id') || ''
                })
            });

            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            if (!resp.body) throw new Error('No streaming support');

            var reader = resp.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';
            var fullText = '';
            var done = false;
            var streamDiv = document.getElementById('section5-stream') || document.getElementById('overlay-stream');

            while (true) {
                var { done: sd, value } = await reader.read();
                if (sd) break;
                buffer += decoder.decode(value, { stream: true });
                var lines = buffer.split('\n');
                buffer = lines.pop();
                for (let i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line.startsWith('data:')) {
                        var data = line.slice(5).replace(/^ /, '');
                        if (data.startsWith('[ERROR]')) {
                            if (section5Area) section5Area.innerHTML = '<div style="color:#f85149;padding:16px;">' + escapeHtml(data) + '</div>';
                            if (overlayDiv) { overlayDiv.querySelector('h3').textContent = '❌ 生成失败'; overlayDiv.querySelector('#overlay-stream').textContent = data; }
                            if (btn) { btn.disabled = false; btn.textContent = getResponseButtonText(); }
                            return;
                        }
                        if (data === '[DONE]') { done = true; break; }
                        fullText += data.replace(/\\n/g, '\n');
                        if (streamDiv) {
                            streamDiv.textContent = fullText;
                            if (overlayDiv) { overlayDiv.scrollTop = overlayDiv.scrollHeight; }
                        }
                    }
                }
                if (done) break;
            }

            // A response made only of Markdown or decorative characters becomes
            // blank after DOCX cleanup. Keep it out of the export path and tell
            // the user to correct the OCR source instead of exporting a blank file.
            var meaningfulChars = (fullText.match(/[\u3400-\u9fffa-zA-Z0-9]/g) || []).length;
            if (meaningfulChars < 80) {
                var qualityError = t('oar.generationQualityError') || '未生成可用的答复书正文。请检查 OA 原文是否可读，必要时粘贴或修正 OA 全文后重试。';
                if (section5Area) section5Area.innerHTML = '<div style="color:#f85149;padding:16px;">' + escapeHtml(qualityError) + '</div>';
                if (overlayDiv) {
                    overlayDiv.querySelector('h3').textContent = '生成内容不可用';
                    overlayDiv.querySelector('#overlay-stream').textContent = qualityError;
                }
                if (btn) { btn.disabled = false; btn.textContent = getResponseButtonText(); }
                return;
            }

            // Store before rendering any action button, so export is immediately available.
            window._generatedResponseText = fullText;
            showPersistentResponseExportButton();

            // Update section 5 area with rendered markdown
            if (section5Area) {
                section5Area.innerHTML = DOMPurify.sanitize('<div style="padding:12px 14px;font-size:13px;line-height:1.8;color:#c9d1d9;">' + renderMarkdown(fullText) + '</div>');
                // Add export button
                section5Area.innerHTML += '<div style="padding:8px 14px;border-top:1px solid #30363d;text-align:right;">' +
                    '<button onclick="exportGeneratedResponse(this)" style="background:#f0883e;color:#fff;border:none;border-radius:6px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:600;">📥 导出 Word 答复书</button></div>';
            } else if (overlayDiv) {
                overlayDiv.querySelector('h3').textContent = '✅ 答复书已生成';
                var contentDiv = overlayDiv.querySelector('#overlay-stream');
                contentDiv.innerHTML = DOMPurify.sanitize(renderMarkdown(fullText));
                contentDiv.style.whiteSpace = 'normal';
                contentDiv.style.fontFamily = 'system-ui, sans-serif';
                contentDiv.style.fontSize = '14px';
                contentDiv.style.lineHeight = '1.8';
                var exportBtn = document.createElement('button');
                exportBtn.textContent = '📥 导出答复书';
                exportBtn.style.cssText = 'margin-top:20px;padding:10px 24px;background:#f0883e;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;';
                exportBtn.onclick = function() { exportGeneratedResponse(exportBtn); };
                contentDiv.parentElement.appendChild(exportBtn);
            }

            // Update section 5 border to solid
            var s5 = document.getElementById('section5-area');
            if (s5) s5.style.border = '1px solid #f0883e44';

            if (btn) { btn.disabled = true; btn.textContent = '✅ ' + (t('oar.generated') || '已生成'); }
        } catch (e) {
            if (section5Area) section5Area.innerHTML = '<div style="color:#f85149;padding:16px;">生成失败: ' + escapeHtml(e.message) + '</div>';
            if (overlayDiv) { overlayDiv.querySelector('h3').textContent = '❌ 生成失败'; overlayDiv.querySelector('#overlay-stream').textContent = e.message; }
            if (btn) { btn.disabled = false; btn.textContent = getResponseButtonText(); }
        }
    }

    async function exportGeneratedResponse(trigger) {
        var text = window._generatedResponseText || '';
        if (!text) { alert('请先生成答复书'); return; }

        var btn = trigger || null;
        var orig = btn ? btn.textContent : '';
        if (btn) {
            btn.disabled = true;
            btn.textContent = '📦 导出中...';
        }

        try {
            var oaType = document.querySelector('input[name="oa_type"]:checked');
            oaType = oaType ? oaType.value : 'unknown';
            var patentNum = uploadedData['patent_number'] || '';
            var applicant = uploadedData['applicant_name'] || '';

            var resp = await fetch('/api/oa/export-docx', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    response_text: text,
                    patent_number: patentNum,
                    applicant: applicant,
                    oa_type: oaType
                })
            });
            var data = await resp.json();
            if (data.error) {
                alert(data.error);
            } else {
                var byteCharacters = atob(data.docx);
                var byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                var byteArray = new Uint8Array(byteNumbers);
                var blob = new Blob([byteArray], {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'OA答复_' + patentNum + '_' + new Date().toISOString().slice(0, 10) + '.docx';
                link.click();
                setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
            }
        } catch (e) {
            alert('导出失败: ' + e.message);
        }
            if (btn) {
                btn.disabled = false;
                btn.textContent = orig;
            }
    }

    function createDiscQuoteBtn() {
        var btn = document.createElement('div');
        btn.className = 'quote-btn';
        btn.textContent = '引用';
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var input = document.getElementById('discussion-input');
            if (input && discSelectedText) {
                var pos = input.selectionStart || input.value.length;
                input.value = input.value.slice(0, pos) + '> ' + discSelectedText.replace(/\n/g, '\n> ') + '\n\n' + input.value.slice(pos);
                input.focus();
            }
            hideDiscQuoteBtn();
        });
        // 追加到 body，避免被讨论容器的 overflow 裁剪
        document.body.appendChild(btn);
        return btn;

        btn.style.position = 'fixed';
        btn.style.display = 'block';
        var w = btn.offsetWidth;
        var h = btn.offsetHeight;

    function addArgCard(text, type) {
        // type: 'confirmed' | 'pending' | 'risk'
        if (!text || text.length < 5) return;
        // 去重
        for (let i = 0; i < argList.length; i++) {
            if (argList[i].text === text) return;
        }
        argList.push({ text: text, type: type || 'pending', status: 'active' });
        renderArgBoard();
    }

    function renderArgBoard() {
        var list = document.getElementById('arg-list');
        if (!list) return;
        var active = argList.filter(function(a) { return a.status === 'active'; });
        if (active.length === 0) { list.innerHTML = ''; return; }
        showArgBoard();
        var html = '';
        for (let i = 0; i < active.length; i++) {
            var a = active[i];
            var typeClass = a.type === 'confirmed' ? 'arg-type-confirmed' : a.type === 'risk' ? 'arg-type-risk' : 'arg-type-pending';
            var typeLabel = a.type === 'confirmed' ? '✅ ' + t('oar.argConfirmed') : a.type === 'risk' ? '⚠️ ' + t('oar.argRisk') : '📌 ' + t('oar.argPending');
            html += '<div class="arg-card" id="arg-card-' + i + '">'
                + '<div><span class="arg-type ' + typeClass + '">' + typeLabel + '</span></div>'
                + '<div class="arg-text">' + escapeHtml(a.text) + '</div>'
                + '<div class="arg-actions">'
                + '<button onclick="setArgStatus(' + i + ',\'adopted\')" title="' + t('oar.argAdopt') + '">✅</button>'
                + '<button onclick="setArgStatus(' + i + ',\'rejected\')" title="' + t('oar.argReject') + '">❌</button>'
                + '</div></div>';
        }
        list.innerHTML = DOMPurify.sanitize(html);
    }

    function setArgStatus(idx, status) {
        if (idx >= 0 && idx < argList.length) {
            argList[idx].status = status;
            renderArgBoard();
        }
    }

    function parseArgsFromAI(content) {
        // 从 AI 回复中提取可能的论点
        var lines = content.split('\n');
        var currentType = 'pending';
        for (let i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            // 检测类型标记
            if (line.indexOf('✅') >= 0 || line.indexOf('已确定') >= 0 || line.indexOf('论点') >= 0) currentType = 'confirmed';
            else if (line.indexOf('⚠️') >= 0 || line.indexOf('风险') >= 0 || line.indexOf('不足') >= 0) currentType = 'risk';
            else if (line.indexOf('📌') >= 0 || line.indexOf('建议') >= 0 || line.indexOf('待补充') >= 0) currentType = 'pending';
            // 提取论点内容（去掉标记符号）
            var clean = line.replace(/^[\s\-*✅⚠️📌📝\d.]+/, '').trim();
            if (clean.length > 10 && clean.indexOf('：') >= 0) {
                addArgCard(clean, currentType);
            } else if (clean.length > 15 && (line.indexOf('：') >= 0 || line.indexOf(':') >= 0 || line.indexOf('、') >= 0)) {
                addArgCard(clean, currentType);
            }
        }
    }

    // ── P0b: Claim Amendment Diff ──
    function computeLineDiff(oldLines, newLines) {
        // Simple LCS-based line diff
        var m = oldLines.length, n = newLines.length;
        var dp = Array(m + 1).fill(null).map(function() { return Array(n + 1).fill(0); });
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                dp[i][j] = oldLines[i - 1] === newLines[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
            }
        }
        var result = [];
        var i = m, j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
                result.unshift({ type: 'same', text: oldLines[i - 1] });
                i--; j--;
            } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                result.unshift({ type: 'add', text: newLines[j - 1] });
                j--;
            } else {
                result.unshift({ type: 'remove', text: oldLines[i - 1] });
                i--;
            }
        }
        return result;
    }

    function showClaimDiff() {
        var editor = document.getElementById('claims-editor');
        var amended = editor.value;

        var oldLines = (original || '').split('\n');

        var diff = computeLineDiff(oldLines, newLines);
        var html = '<div style="font-family:monospace;font-size:13px;line-height:1.6;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px;margin-top:8px;max-height:400px;overflow-y:auto;">';
        for (let i = 0; i < diff.length; i++) {
            var d = diff[i];
            if (d.type === 'same') {
                html += '<div style="color:#8b949e;padding:1px 8px;">' + escapeHtml(d.text) + '</div>';
            } else if (d.type === 'add') {

            } else {

            }

    // ── P1a: Mapping Matrix ──
    function extractMappingMatrix(analysisText) {
        var section = document.getElementById('matrix-section');
        var content = document.getElementById('matrix-content');
        if (!section || !content || !analysisText) return;
        // Parse AI output for structured claim mapping
        var rows = [];
        var lines = analysisText.split('\n');
        var currentClaim = '', currentReason = '', currentArticle = '', currentRef = '';
        for (let i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            // Extract claim numbers
            var claimMatch = line.match(/权利要求\s*(\d+[\d,\s、\-]*\d*)/);
            if (claimMatch) currentClaim = claimMatch[1];
            // Extract rejection reason
            if (line.indexOf('新颖性') >= 0 || line.indexOf('创造性') >= 0 || line.indexOf('不支持') >= 0 || line.indexOf('不清楚') >= 0) {
                currentReason = line.indexOf('新颖性') >= 0 ? '缺乏新颖性' : line.indexOf('创造性') >= 0 ? '缺乏创造性' : line.indexOf('不支持') >= 0 ? '不支持' : '不清楚';
            }
            // Extract article
            var articleMatch = line.match(/A22\.\d|A25|A26\.\d|A33/);
            if (articleMatch) currentArticle = articleMatch[0];
            // Extract reference
            var refMatch = line.match(/对比文件\s*(\d+)|D\s*(\d+)/i);
            if (refMatch) {
                currentRef = 'D' + (refMatch[1] || refMatch[2]);
                rows.push({ claim: currentClaim || '-', reason: currentReason || '-', article: currentArticle || '-', ref: currentRef || '-' });
            } else if (currentClaim && currentReason && !currentRef) {
                rows.push({ claim: currentClaim, reason: currentReason, article: currentArticle || '-', ref: '-' });
                currentClaim = ''; currentReason = ''; currentArticle = ''; currentRef = '';
            }
        }
        if (rows.length === 0) return;
        section.style.display = '';
        var html = '<table style="width:100%;border-collapse:collapse;"><thead><tr>';
        html += '<th style="background:#21262d;color:#c9d1d9;padding:8px;border:1px solid #30363d;">权利要求</th>';
        html += '<th style="background:#21262d;color:#c9d1d9;padding:8px;border:1px solid #30363d;">驳回理由</th>';
        html += '<th style="background:#21262d;color:#c9d1d9;padding:8px;border:1px solid #30363d;">法条</th>';
        html += '<th style="background:#21262d;color:#c9d1d9;padding:8px;border:1px solid #30363d;">对比文件</th></tr><tbody>';
        for (let i = 0; i < rows.length; i++) {
            html += '<tr><td style="padding:8px;border:1px solid #30363d;color:#c9d1d9;">' + escapeHtml(rows[i].claim) + '</td>';
            html += '<td style="padding:8px;border:1px solid #30363d;color:#c9d1d9;">' + escapeHtml(rows[i].reason) + '</td>';
            html += '<td style="padding:8px;border:1px solid #30363d;color:#58a6ff;">' + escapeHtml(rows[i].article) + '</td>';
            html += '<td style="padding:8px;border:1px solid #30363d;color:#d29922;">' + escapeHtml(rows[i].ref) + '</td></tr>';
        }
        html += '</tbody></table>';
        content.innerHTML = DOMPurify.sanitize(html);
    }

    async function sendDiscussionMessage() {
        var input = document.getElementById('discussion-input');
        var text = input.value.trim();
        if (!text) return;
        if (oaCadController.shouldHandle(text)) {
            input.value = '';
            await oaCadController.draw(text);
            return;
        }
        if (discussionSending) {
            if (discussionAbortController) {
                discussionAbortController.abort();
                discussionAbortController = null;
            }
            var container = document.getElementById('discussion-messages');
            var last = container.lastChild;
            if (last && last.classList.contains('msg-ai') && last.id === 'ai-loading-disc') {
                container.removeChild(last);
            }
        }
        input.value = '';
        input.disabled = true;
        document.getElementById('discussion-send-btn').disabled = true;
        discussionSending = true;
        showDiscussionStopButton();

        // render user message
        var container = document.getElementById('discussion-messages');
        var userDiv = document.createElement('div');
        userDiv.className = 'msg msg-user';
        userDiv.innerHTML = DOMPurify.sanitize('<div class="msg-bubble">' + escapeHtml(text) + '</div>');
        container.appendChild(userDiv);

        // loading indicator
        var loadDiv = document.createElement('div');
        loadDiv.className = 'msg msg-ai';
        loadDiv.id = 'ai-loading-disc';
        loadDiv.innerHTML = DOMPurify.sanitize('<div class="msg-bubble">' + t('common.thinking') + '</div>');
        container.appendChild(loadDiv);
        container.scrollTop = container.scrollHeight;

        var controller = new AbortController();
        discussionAbortController = controller;
        var apiHistory = discussionHistory.map(function(h) { return [h[0], h[1]]; });

        // 专业代理师指令放在 user message 里（不放 system role，避开上游角色扮演审查）
        var proInstruction = '请以中国专利代理师视角回答：每处引用具体法条（A22.2新颖性/A22.3创造性/A26.3说明书支持/A33修改超范围），给修改方案时用"修改前→修改后"对比格式，区分"可克服"和"难克服"的缺陷并给出置信度。';
        var ctxParts = [];
        if (typeof oaDiscussOAText !== 'undefined' && oaDiscussOAText) ctxParts.push('【审查意见原文】\n' + oaDiscussOAText);
        if (typeof lastAnalysisRawText !== 'undefined' && lastAnalysisRawText) ctxParts.push('【当前OA分析结果】\n' + lastAnalysisRawText);
        ctxParts.push(proInstruction);
        ctxParts.push('我的问题：' + text);
        var messageWithContext = ctxParts.join('\n\n');

        try {
            // 用非流式接口 /api/ai/chat；不传 system_prompt，用后端默认 system 避开上游角色扮演审查
            var resp = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: messageWithContext,
                    patent_id: null,
                    history: apiHistory,
                    web_search: false
                }),
                signal: controller.signal
            });

            var data = await resp.json();
            var loadEl = document.getElementById('ai-loading-disc');
            if (loadEl) loadEl.remove();

            // 兼容两种响应格式：{content: "..."} 或 {error: {...}}
            var content;
            if (data.error) {
                content = 'AI 调用失败：' + (data.error.message || JSON.stringify(data.error));
            } else {
                content = data.content || 'AI error: empty response';
            }

            discussionHistory.push(['user', text, new Date().toISOString()]);
            discussionHistory.push(['assistant', content, new Date().toISOString()]);
            parseArgsFromAI(content);

            var aiDiv = document.createElement('div');
            aiDiv.className = 'msg msg-ai';
            aiDiv.innerHTML = DOMPurify.sanitize('<div class="msg-bubble">' + renderMarkdown(content) + '</div>');
            container.appendChild(aiDiv);
            container.scrollTop = container.scrollHeight;
            showDiscussionExportButton();
        } catch (e) {
            var loadEl = document.getElementById('ai-loading-disc');
            if (loadEl) loadEl.remove();
            if (e.name === 'AbortError') return;
            var errDiv = document.createElement('div');
            errDiv.className = 'msg msg-ai';
            errDiv.innerHTML = DOMPurify.sanitize('<div class="msg-bubble" style="color:#f85149;">' + t('oar.fail') + ': ' + escapeHtml(e.message) + '</div>');
            container.appendChild(errDiv);
        } finally {
            if (discussionAbortController === controller) {
                discussionAbortController = null;
            }
            input.disabled = false;
            document.getElementById('discussion-send-btn').disabled = false;
            discussionSending = false;
            hideDiscussionStopButton();
            input.focus();
        }
    }

            discussionTranscriptCodeBlock(systemEntry[1]),
            '',
            '## ' + t('oar.transcriptMessages')
        ];

        for (let i = 1; i < discussionHistory.length; i++) {
            var entry = discussionHistory[i];
