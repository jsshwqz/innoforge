    function initDiscQuoteEvents() {
        // 同时绑定新旧两个讨论容器
        var containers = [
            document.getElementById('discussion-messages'),
            document.getElementById('oa-discuss-messages')
        ].filter(function(el) { return el; });

        containers.forEach(function(container) {
            container.addEventListener('mouseup', function(e) {
                var target = e.target;
                if (target && target.nodeType === 3) target = target.parentNode;
                if (target && target.closest && target.closest('.quote-btn')) return;
                setTimeout(function() {
                    var sel = window.getSelection();
                    var text = sel ? sel.toString().trim() : '';
                    if (!text) { hideDiscQuoteBtn(); return; }
                    var node = sel.anchorNode;
                    if (node) {
                        if (node.nodeType === 3) node = node.parentNode;
                        if (!node.closest('.msg-bubble')) { hideDiscQuoteBtn(); return; }
                    }
                    if (!sel.rangeCount) return;
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    if (!rect || (rect.width === 0 && rect.height === 0)) { hideDiscQuoteBtn(); return; }
                    showDiscQuoteBtn(text, rect);
                }, 10);
            });
            container.addEventListener('scroll', function() { hideDiscQuoteBtn(); });
        });
        document.addEventListener('mousedown', function(e) {
            if (e.target && e.target.closest && e.target.closest('.quote-btn')) return;
            hideDiscQuoteBtn();
        });
    }

    function attachDiscussFile() {

        if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
            if (labelEl) labelEl.style.display = 'none';

        var file = fileInput.files[0];
        var maxSize = 10 * 1024 * 1024; // 10MB
        if (file.size > maxSize) {
            alert('文件过大（最大 10MB）');
            fileInput.value = '';
            return;
        }

        // 读取文件并存储为 base64
        var reader = new FileReader();
        reader.onload = function(e) {
            var dataUrl = e.target.result;
            window._oaDiscussPendingFile = {
                name: file.name,
                type: file.type,
                size: file.size,
                dataUrl: dataUrl,
                base64: dataUrl.split(',')[1] || ''
            };
            if (labelEl) {
                labelEl.textContent = '📎 ' + file.name;
                labelEl.style.display = 'inline';
            }
        };
        reader.readAsDataURL(file);
    }

    async function doOADiscussImport() {
        var textarea = document.getElementById('oa-import-textarea');
        var text = textarea ? textarea.value.trim() : '';
        if (!text) {
            alert('请先粘贴讨论内容');
            return;
        }

        var patentNum = getPatentNumberFromUrl();
        if (!patentNum) {
            alert('请先打开一个专利');
            return;
        }

        var dialog = document.getElementById('oa-import-dialog');
        if (dialog) dialog.remove();

        // 将纯文本解析为消息列表：按段落分割，交替为用户/AI 消息
        var lines = text.split(/\n\s*\n/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
        var messages = [];

        lines.forEach(function(line, idx) {
            var role = (idx % 2 === 0) ? 'user' : 'assistant';
            messages.push({ role: role, content: line });
        });

        if (messages.length === 0) {
            alert('未解析到有效内容');
            return;
        }

        try {
            // 如果 oaDiscussOAText 为空（未走分析流程），从已上传的 OA 文件中提取
            var oaTextForImport = oaDiscussOAText || '';
            if (!oaTextForImport && typeof uploadedData !== 'undefined' && uploadedData['oa']) {
                oaTextForImport = uploadedData['oa'].content || '';
            }
            var resp = await fetch('/api/oa/discussions/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    patent_number: patentNum,
                    oa_text: oaTextForImport,
                    messages: messages
                })
            });
            var data = await resp.json();
            if (!resp.ok || !data.ok) {
                alert('导入失败: ' + (data.error || '未知错误'));
                return;
            }
            // 导入成功，自动恢复该讨论（recoverOADiscussion 会解析 oa_text）
            // 同时确保 oaDiscussOAText 被填充（后端返回的 oa_text 可能为空时从 OA 文件补）
            if (!oaTextForImport) {
                // 降级：从已上传的 OA 文件提取
                if (typeof uploadedData !== 'undefined' && uploadedData['oa']) {
                    oaDiscussOAText = uploadedData['oa'].content || '';
                }
            }
            recoverOADiscussion(data.discussion_id);
            // 导入后直接渲染讨论区 + 生成按钮（不弹窗，用户可先讨论再生成）
            setTimeout(function() {
                renderImportDiscussionPanel();
            }, 300);
        } catch (e) {
            alert('导入失败: ' + e.message);
        }
    }

            + '<h3 style="margin:0 0 16px 0;color:#c9d1d9;">✅ 讨论导入成功</h3>'
            + '<p style="margin:0 0 20px 0;color:#8b949e;font-size:13px;line-height:1.6;">讨论内容已恢复，可立即生成答复书提交。</p>'
            + '<button id="oa-gen-btn" style="padding:10px 24px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;" data-i18n="oar.btnGenerateResponse">📝 生成答复书</button>'
            + '</div>';
        document.body.appendChild(dialog);
        document.getElementById('oa-gen-btn').addEventListener('click', function() {
            dialog.remove();
            // 检查生成答复书所需上下文
            if (!oaDiscussOAText || oaDiscussOAText.trim().length < 10) {
                alert('⚠️ 请先在「审查意见通知书」框中粘贴 OA 全文，再生成答复书。');
                return;
            }
            generateResponseLetter();
        });
    }

    // ── 导入后渲染讨论面板（替代弹窗，允许用户先讨论再生成） ──
    function renderImportDiscussionPanel() {
        var container = document.getElementById('result');
        if (!container) return;

        // 渲染讨论消息
        var html = '<div class="result-box" style="margin-top:8px;">';
        html += '<div style="margin-bottom:12px;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;font-size:13px;color:#58a6ff;">';
        html += '📋 ' + (t('oar.importSuccess') || '讨论已恢复') + ' — ' + (t('oar.importHint') || '可继续讨论完善论点，确认无误后点击下方按钮生成答复书');
        html += '</div>';

        // 讨论消息区
        html += '<div style="border:1px solid #30363d;border-radius:8px;background:#0d1117;margin-bottom:16px;">';
        html += '<div style="background:#1a2332;padding:8px 12px;border-bottom:1px solid #30363d;border-radius:8px 8px 0 0;">';
        html += '<span style="color:#58a6ff;font-weight:600;font-size:14px;">💬 ' + (t('oar.discussTitle') || '讨论区') + '</span>';
        html += '</div>';
        html += '<div id="oa-discuss-messages" style="max-height:500px;overflow-y:auto;padding:16px;position:relative;">';

        if (oaDiscussMessages.length === 0) {
            html += '<div style="color:#8b949e;font-size:13px;text-align:center;padding:24px;">暂无讨论内容，请继续添加</div>';
        } else {
            for (let i = 0; i < oaDiscussMessages.length; i++) {
                var msg = oaDiscussMessages[i];
                var isUser = msg.role === 'user';
                var isAssistant = msg.role === 'assistant';
                if (isUser) {
                    html += '<div style="display:flex;justify-content:flex-end;margin-bottom:16px;">';
                    html += '<div style="max-width:75%;background:#1f6feb;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.7;color:#c9d1d9;">';
                    html += escapeHtml(msg.content || '');
                    html += '</div></div>';
                } else if (isAssistant) {
                    html += '<div style="display:flex;justify-content:flex-start;margin-bottom:16px;">';
                    html += '<div style="max-width:75%;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.7;color:#c9d1d9;">';
                    html += renderMarkdown(msg.content || '');
                    html += '</div></div>';
                }
            }
        }
        html += '</div></div>';

        // 输入框
        html += '<div style="border:1px solid #30363d;border-radius:8px;background:#0d1117;margin-bottom:16px;">';
        html += '<div style="background:#1a2332;padding:8px 12px;border-bottom:1px solid #30363d;border-radius:8px 8px 0 0;">';
        html += '<span style="color:#58a6ff;font-weight:600;font-size:14px;">✏️ ' + (t('oar.discussAdd') || '继续讨论') + '</span>';
        html += '</div>';
        html += '<div style="padding:8px 12px;display:flex;gap:8px;">';
        html += '<textarea id="oa-discuss-input" rows="2" placeholder="输入讨论内容..." style="flex:1;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#c9d1d9;font-size:13px;resize:vertical;" onkeydown="if(event.key===\'Enter\'&&event.shiftKey){}else if(event.key===\'Enter\'){event.preventDefault();sendOADiscussion();}"></textarea>';
        html += '<button onclick="sendOADiscussion()" style="background:#238636;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;white-space:nowrap;height:fit-content;margin-top:4px;">' + (t('oar.discussSend') || '发送') + '</button>';
        html += '</div></div>';

        // ── 生成答复书按钮 ──
        html += '<div style="margin-top:8px;text-align:center;">';
        html += '<button id="btn-generate-response" onclick="generateResponseLetter()" style="background:#f0883e;color:#fff;border:none;border-radius:8px;padding:14px 40px;cursor:pointer;font-size:16px;font-weight:600;box-shadow:0 2px 8px rgba(240,136,62,0.3);">';
        html += getResponseButtonText();
        html += '</button>';
        html += '<div style="color:#8b949e;font-size:12px;margin-top:8px;">' + getGenerateHintText() + '</div>';
        html += '</div>';

        html += '</div>';
        container.innerHTML = DOMPurify.sanitize(html);
        oaInputHistory = initChatHistory('oa-discuss-input');

        // 聚焦输入框
        var input = document.getElementById('oa-discuss-input');
        if (input) input.focus();
    }

    // ── Apply i18n for dynamic text ──
    renderNavbar('oar');
    renderSidebar();
    applyI18nCommon();
    loadOaState();
    loadOaHistory();
    initDiscQuoteEvents();
    initDeadline();

    // ── OA 历史轮次选择器 ─────────────────────────────────
    async function loadOaRoundSelector() {
        const select = document.getElementById('oa-round-select');
        if (!select) return;
        const patentNum = getCurrentPatentNumber();
        if (!patentNum) return;
        try {
            const resp = await fetch('/api/oa/rounds/' + encodeURIComponent(patentNum));
            const data = await resp.json();
            if (data.status !== 'ok' || !data.rounds || data.rounds.length === 0) {
                select.innerHTML = '<option value="">--</option>';
                return;
            }
            let options = '<option value="">--</option>';
            data.rounds.forEach(function(round) {
                const typeLabel = {
                    'first_rejection': '一审驳回',
                    'second_rejection': '二审驳回',
                    'reexamination': '复审',
                    'office_action': '审查意见'
                }[round.round_type] || round.round_type;
                options += '<option value="' + round.id + '">第' + round.round_number + '轮 · ' + typeLabel + '</option>';
            });
            select.innerHTML = options;
        } catch (e) {
            console.error('Failed to load OA rounds:', e);
        }
    }

    async function loadSelectedRound() {
        const select = document.getElementById('oa-round-select');
        if (!select || !select.value) return;
        try {
            const resp = await fetch('/api/oa/rounds/' + encodeURIComponent(select.value));
            const data = await resp.json();
            if (data.status !== 'ok' || !data.round) return;
            const round = data.round;
            // 如果有 OA 文本，填充到 OA 文本框
            if (round.oa_text) {
                const oaTextarea = document.getElementById('oa-text') || document.getElementById('oa_text');
                if (oaTextarea) oaTextarea.value = round.oa_text;
            }
            // 如果有答复文本，显示在结果区
            if (round.response_text) {
                const resultArea = document.getElementById('analysis-result') || document.getElementById('oa-result');
                if (resultArea) {
                    resultArea.style.display = 'block';
                    resultArea.innerHTML = '<pre style="white-space: pre-wrap;">' + escapeHtmlOa(round.response_text) + '</pre>';
                }
            }
        } catch (e) {
            console.error('Failed to load selected round:', e);
        }
    }

    async function createOaRoundFromPage() {
        const patentNum = getCurrentPatentNumber();
        if (!patentNum) {
            alert('请先输入专利号');
            return;
        }
        const oaTypeMap = {
            'first_exam': 'first_rejection',
            'abnormal': 'second_rejection',
            'reject_review': 'reexamination'
        };
        const selectedType = document.querySelector('input[name="oa_type"]:checked');
        const roundType = selectedType ? (oaTypeMap[selectedType.value] || 'office_action') : 'office_action';
        const oaDate = prompt('发文日期 (YYYY-MM-DD):', new Date().toISOString().slice(0, 10));
        try {
            const oaTextarea = document.getElementById('oa-text') || document.getElementById('oa_text');
            const oaText = oaTextarea ? oaTextarea.value : '';
            await fetch('/api/oa/rounds', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    patent_id: patentNum,
                    round_type: roundType,
                    oa_date: oaDate || null,
                    oa_text: oaText || null
                })
            });
            loadOaRoundSelector();
        } catch (e) {
            console.error('Failed to create OA round:', e);
        }
    }

    function escapeHtmlOa(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getCurrentPatentNumber() {
        const el = document.getElementById('patent-number-value');
        if (el && el.textContent.trim()) return el.textContent.trim();
        const input = document.getElementById('patent-number') || document.getElementById('patent_no');
        if (input && input.value) return input.value;
        return '';
    }

    // 初始加载轮次选择器
    loadOaRoundSelector();
    </script>
</body>
</html>
